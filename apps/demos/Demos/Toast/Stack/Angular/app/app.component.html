<div class="options">
  <div>Position</div>
  <dx-radio-group
    layout="horizontal"
    [items]="['predefined', 'coordinates']"
    value="predefined"
    (onValueChanged)="radioGroupValueChanged($event)"
  >
  </dx-radio-group>
  <dx-select-box
    [items]="positions"
    [inputAttr]="{ 'aria-label': 'Position' }"
    [(value)]="predefinedPosition"
    [visible]="isPredefined()"
  >
  </dx-select-box>
  <div class="section">
    <dx-number-box
      [visible]="!isPredefined()"
      placeholder="top"
      [(value)]="top"
      width="48%"
      valueChangeEvent="keyup"
      [disabled]="!!bottom()"
      [inputAttr]="{ 'aria-label': 'Position Top' }"
    >
    </dx-number-box>
    <dx-number-box
      [visible]="!isPredefined()"
      placeholder="bottom"
      [(value)]="bottom"
      width="48%"
      valueChangeEvent="keyup"
      [disabled]="!!top()"
      [inputAttr]="{ 'aria-label': 'Position Bottom' }"
    >
    </dx-number-box>
  </div>
  <div class="section">
    <dx-number-box
      [visible]="!isPredefined()"
      placeholder="left"
      [(value)]="left"
      width="48%"
      valueChangeEvent="keyup"
      [disabled]="!!right()"
      [inputAttr]="{ 'aria-label': 'Position Left' }"
    >
    </dx-number-box>
    <dx-number-box
      [visible]="!isPredefined()"
      placeholder="right"
      [(value)]="right"
      width="48%"
      valueChangeEvent="keyup"
      [disabled]="!!left()"
      [inputAttr]="{ 'aria-label': 'Position Right' }"
    >
    </dx-number-box>
  </div>
  <div>Direction</div>
  <dx-select-box
    [items]="directions"
    [(value)]="direction"
    [inputAttr]="{ 'aria-label': 'Direction' }"
  >
  </dx-select-box>
  <div class="section">
    <dx-button text="Show" width="48%" (onClick)="show()"></dx-button>
    <dx-button text="Hide all" width="48%" (onClick)="hideAll()"></dx-button>
  </div>
</div>
