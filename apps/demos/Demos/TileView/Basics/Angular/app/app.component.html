<dx-tile-view class="dx-tile-content">
  @for (home of homes; track home) {
    <dxi-tile-view-item
      [widthRatio]="home.widthRatio ?? 1"
      [heightRatio]="home.heightRatio ?? 1"
    >
      <div
        class="image"
        [style.background-image]="'url(' + home.ImageSrc + ')'"
      ></div>
    </dxi-tile-view-item>
  }
</dx-tile-view>
