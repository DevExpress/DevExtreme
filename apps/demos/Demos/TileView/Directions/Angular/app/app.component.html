<dx-tile-view
  [height]="390"
  [baseItemHeight]="120"
  [baseItemWidth]="185"
  width="100%"
  [itemMargin]="10"
  [direction]="direction()"
>
  @for (home of homes; track home) {
    <dxi-tile-view-item
      [widthRatio]="home.widthRatio"
      [heightRatio]="home.heightRatio"
    >
      <div
        class="image"
        [style.background-image]="'url(' + home.ImageSrc + ')'"
      ></div>
    </dxi-tile-view-item>
  }
</dx-tile-view>
<div class="options">
  <div class="caption">Options</div>
  <div class="option">
    <span>Direction</span>
    <dx-select-box
      [items]="['horizontal', 'vertical']"
      [inputAttr]="{ 'aria-label': 'Direction' }"
      [(value)]="direction"
    >
    </dx-select-box>
  </div>
</div>
