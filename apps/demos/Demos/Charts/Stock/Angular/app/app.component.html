<dx-toolbar>
  <dxi-toolbar-item
    location="before"
    text="Stock Price"
    cssClass="chart-title"
  >
  </dxi-toolbar-item>
  <dxi-toolbar-item
    location="after"
    widget="dxButton"
    [options]="panLeftButtonOptions"
  >
  </dxi-toolbar-item>
  <dxi-toolbar-item
    location="after"
    widget="dxButton"
    [options]="panRightButtonOptions"
  >
  </dxi-toolbar-item>
  <dxi-toolbar-item
    location="after"
    widget="dxButton"
    [options]="zoomOutButtonOptions"
  >
  </dxi-toolbar-item>
  <dxi-toolbar-item
    location="after"
    widget="dxButton"
    [options]="zoomInButtonOptions"
  >
  </dxi-toolbar-item>
  <dxi-toolbar-item
    location="after"
    widget="dxButton"
    [options]="resetZoomButtonOptions"
  >
  </dxi-toolbar-item>
  <dxi-toolbar-item
    location="after"
    widget="dxDropDownButton"
    [options]="exportButtonOptions"
  >
  </dxi-toolbar-item>
</dx-toolbar>
<dx-chart id="chart" [dataSource]="stockPrices">
  <dxi-chart-series
    name="E-Mart"
    openValueField="o"
    highValueField="h"
    lowValueField="l"
    closeValueField="c"
  >
    <dxo-chart-reduction color="red"></dxo-chart-reduction>
  </dxi-chart-series>
  <dxo-chart-common-series-settings argumentField="date" type="stock">
  </dxo-chart-common-series-settings>
  <dxo-chart-zoom-and-pan
    argumentAxis="both"
    [dragToZoom]="true"
    [allowMouseWheel]="true"
  >
  </dxo-chart-zoom-and-pan>
  <dxo-chart-scroll-bar
    [visible]="true"
    position="bottom"
  ></dxo-chart-scroll-bar>
  <dxo-chart-legend
    verticalAlignment="bottom"
    horizontalAlignment="center"
  ></dxo-chart-legend>
  <dxi-chart-value-axis [tickInterval]="1" position="right">
    <dxo-chart-title text="US dollars"></dxo-chart-title>
    <dxo-chart-label>
      <dxo-chart-format type="currency" [precision]="0"> </dxo-chart-format>
    </dxo-chart-label>
  </dxi-chart-value-axis>
  <dxo-chart-argument-axis
    [(visualRange)]="visualRange"
    [minVisualRangeLength]="minVisualRange"
  >
    <dxo-chart-label
      overlappingBehavior="rotate"
      [rotationAngle]="30"
      [customizeText]="customizeLabelText"
    ></dxo-chart-label>
  </dxo-chart-argument-axis>
  <dxo-chart-tooltip
    [enabled]="true"
    [format]="{ type: 'currency', precision: 2 }"
    location="edge"
    [customizeTooltip]="customizeTooltip"
  >
  </dxo-chart-tooltip>
</dx-chart>
