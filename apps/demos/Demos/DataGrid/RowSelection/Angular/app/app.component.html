<dx-data-grid
  id="gridContainer"
  [dataSource]="employees"
  keyExpr="ID"
  [hoverStateEnabled]="true"
  [showBorders]="true"
  (onSelectionChanged)="onSelectionChanged($event)"
>
  <dxo-data-grid-selection mode="single"></dxo-data-grid-selection>
  <dxi-data-grid-column
    dataField="Prefix"
    caption="Title"
    [width]="70"
  ></dxi-data-grid-column>
  <dxi-data-grid-column dataField="FirstName"></dxi-data-grid-column>
  <dxi-data-grid-column dataField="LastName"></dxi-data-grid-column>
  <dxi-data-grid-column
    dataField="Position"
    [width]="180"
  ></dxi-data-grid-column>
  <dxi-data-grid-column
    dataField="BirthDate"
    dataType="date"
  ></dxi-data-grid-column>
  <dxi-data-grid-column
    dataField="HireDate"
    dataType="date"
  ></dxi-data-grid-column>
</dx-data-grid>
@if (selectedEmployee) {
<div id="employeeInfo">
  <img
    class="employeePhoto"
    [src]="selectedEmployee.Picture"
    alt="Employee photo"
  />
  <p class="employeeNotes">{{ selectedEmployee.Notes }}</p>
</div>
}
