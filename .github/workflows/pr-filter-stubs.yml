name: PR Filter Stubs

on:
  pull_request:
    paths:
      - 'apps/**/*.md'

jobs:

  mdOnlyFilter:
    name: 'MD-only filter'
    runs-on: ubuntu-latest
    outputs:
      hasOtherFiles: ${{ steps.otherFilesFilter.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Other files filter
        id: otherFilesFilter
        uses: DevExpress/github-actions/pr-filter@pr-filter
        with:
          paths: '**;!apps/**/*.md'
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  stubChecksReady:
    name: 'Stub checks ready'
    needs: [ mdOnlyFilter ]
    if: needs.mdOnlyFilter.outputs.hasOtherFiles != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare required check stubs
        run: echo "Required check stubs are available for apps/**/*.md PRs."

  # build_all.yml, playgrounds_tests.yml, wrapper_tests.yml
  build1:
    name: 'build'
    needs: [ stubChecksReady ]
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
  # wrapper_tests.yml
  wrapper_tests2:
    name: 'test (angular)'
    needs: [ stubChecksReady ]
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
  wrapper_tests3:
