    <script nonce="TEiwcJ">
        (function() {
            var doneCount = 0,
                parentWindow = window.opener || window.parent;

            QUnit.done(function(data) {
                if(doneCount == 1)
                    notifyExtraDoneCall();

                if(!doneCount && parentWindow && parentWindow.RUNNER_ON_DONE)
                    parentWindow.RUNNER_ON_DONE(window, data);

                doneCount++;
            });

            QUnit.testStart(function(data) {
                data.suiteUrl = location.pathname;
                if(parentWindow && parentWindow.RUNNER_ON_TEST_START)
                    parentWindow.RUNNER_ON_TEST_START(window, data);
            });

            QUnit.log(function(data) {
                data.suiteUrl = location.pathname;
                if(parentWindow && parentWindow.RUNNER_ON_TEST_LOG)
                    parentWindow.RUNNER_ON_TEST_LOG(window, data);
            });

            QUnit.testDone(function(data) {
                data.suiteUrl = location.pathname;
                if(parentWindow && parentWindow.RUNNER_ON_TEST_DONE )
                    parentWindow.RUNNER_ON_TEST_DONE(window, data);
            });

            QUnit.config.urlConfig.push({
                id: "nojquery",
                label: "No jQuery",
                tooltip: "Don't use jQuery for widget rendering"
            });

            QUnit.config.urlConfig.push({
                id: "nocsp",
                label: "No CSP",
                tooltip: "Use nocsp components without CSP checks",
            });

            function notifyExtraDoneCall() {
                var msg = "QUnit.done called several times. Possible causes: extra start() calls, assertion outside test context";

                if(parentWindow && parentWindow.RUNNER_ON_MISC_ERROR) {
                    parentWindow.RUNNER_ON_MISC_ERROR(window, msg);
                } else {
                    alert("ALARM! DO NOT IGNORE THIS!\\n" + msg);
                }
            }
        })();
    </script>

    <script src="{{JQUERY_JS_URL}}"></script>

<body>
<a class="up" href="/"></a>
<div id="qunit"></div>
<div id="qunit-fixture"></div>

<script type="module" nonce="Z27qXj">
    (function() {
        var integrationImportPaths = {{{INTEGRATION_IMPORT_PATHS_JSON}}};
        var themeCssImportPaths = {{{THEME_CSS_IMPORT_PATHS_JSON}}};
        var testUrl = {{{TEST_URL_JSON}}};
        var isServerSideTest = {{{IS_SERVER_SIDE_TEST_JSON}}};

        function startQUnit() {
            QUnit.start();
        }

        function failLoad(err) {
            QUnit.start();
            QUnit.test("load failed", function(assert) {
                var detail = err;
                if(err && err.cause) {
                    detail = err.message + "\nCaused by: " + err.cause
                        + (err.cause.stack ? "\n" + err.cause.stack : "");
                }
                throw detail;
            });
        }

        function afterReady(loadTest) {
            var ready = new Promise(function(resolve) {
                // Prefer jQuery ready when the classic script left a working
                // global; fall back for nojquery / if a module cleared it.
                if(typeof jQuery === 'function') {
                    jQuery(resolve);
                    return;
                }
                if(document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', resolve, { once: true });
                    return;
                }
                resolve();
            });

            return ready.then(function() {
                var isNotWebkitBrowser = window.navigator.userAgent.toLowerCase().indexOf("webkit") < 0;

                if(isServerSideTest && isNotWebkitBrowser) {
                    return;
                }

                return loadTest();
            });
        }

        // Sibling ESM imports load in parallel, so theme CSS must be applied
        // before modules that snapshot themes.current() / isMaterialBased()
        // at import time.
        function preloadThemeCss() {
            if(!themeCssImportPaths || !themeCssImportPaths.length) {
                return Promise.resolve();
            }

            return Promise.all(themeCssImportPaths.map(function(specifier) {
                return import(specifier);
            })).then(function() {
                return new Promise(function(resolve) {
                    var started = Date.now();
                    (function check() {
                        var el = document.createElement('div');
                        el.className = 'dx-theme-marker';
                        document.documentElement.appendChild(el);
                        var family = window.getComputedStyle(el).fontFamily || '';
                        el.remove();
                        if(family.indexOf('dx.') !== -1 || Date.now() - started > 2000) {
                            resolve();
                            return;
                        }
                        setTimeout(check, 10);
                    })();
                });
            });
        }

        var imports = integrationImportPaths.map(function(importPath) {
            return import(importPath);
        });

        Promise.all(imports)
            .then(function() {
                return afterReady(function() {
                    return preloadThemeCss().then(function() {
                        return import(testUrl);
                    });
                });
            })
            .then(startQUnit)
            .catch(failLoad);
    })();
</script>
</body>
