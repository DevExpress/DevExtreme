<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>disabled / readonly compare frame</title>
<link id="theme" rel="stylesheet" type="text/css">
<script src="../artifacts/js/jquery.js"></script>
<script src="../artifacts/js/dx-quill.js"></script>
<script src="../artifacts/js/dx-gantt.js"></script>
<script src="../artifacts/js/dx-diagram.js"></script>
<script src="../artifacts/js/dx.all.debug.js" charset="utf-8"></script>
<style>
  html, body { margin: 0; }
  body { font: 12px/1.4 -apple-system, "Segoe UI", sans-serif; }
  .row { box-sizing: border-box; padding: 10px 12px; border-bottom: 1px solid rgba(128,128,128,.25); }
  .row > .label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; opacity: .5; margin-bottom: 6px; }
  .host { min-width: 0; }
</style>
</head>
<body class="dx-viewport">
<div id="gallery"></div>
<script>
/*
 * One column of the disabled / readonly comparison. Query parameters:
 *   theme  - bundle name, e.g. fluent-next.blue.light
 *   state  - enabled | disabled | readonly
 * Every column renders the same cases in the same order at the same fixed heights, so the
 * shell can put the columns side by side and scroll them together.
 * window.__cases and window.__fp (per-case colour fingerprint) are read by the shell.
 */
const params = new URLSearchParams(location.search);
const THEME = params.get('theme') || 'fluent-next.blue.light';
const STATE = params.get('state') || 'disabled';

// The bundle is a megabyte and the browser caches it hard; without the buster a rebuilt
// stylesheet is silently ignored and the comparison keeps showing the previous build.
const BUST = params.get('_') || '';
document.getElementById('theme').href = `../artifacts/css/dx.${THEME}.css${BUST ? '?_=' + BUST : ''}`;
const items = ['Alpha', 'Beta', 'Gamma'];
const products = [{ ID: 1, Name: 'Alpha' }, { ID: 2, Name: 'Beta' }];

// [id, label, height, builder]. The builder receives the flags of the current column.
// A portalled case keeps its instance on the host so the opener can toggle it: firing the button
// twice should close what it opened, not leave four overlays standing.
const toggleVisible = (h) => h.__inst.option('visible', !h.__inst.option('visible'));
const anchor = (h, text) => {
  const el = document.createElement('div');
  el.className = 'dx-anchor';
  el.style.cssText = 'padding:4px;display:inline-block';
  el.textContent = text;
  h.appendChild(el);
  return el;
};

const CASES = [
  // --- components that already own their disabled colours (opacity: 1 + roles) -------------
  ['buttonGroup', 'ButtonGroup', 70, (h, f) => $(h).dxButtonGroup({ items: [{ text: 'One' }, { text: 'Two' }], keyExpr: 'text', selectedItemKeys: ['One'], ...f })],
  ['checkBox', 'CheckBox', 70, (h, f) => $(h).dxCheckBox({ value: true, text: 'Checked', ...f })],
  ['radioGroup', 'RadioGroup', 90, (h, f) => $(h).dxRadioGroup({ items: ['One', 'Two'], value: 'One', ...f })],
  ['switch', 'Switch', 70, (h, f) => $(h).dxSwitch({ value: true, ...f })],
  ['textArea', 'TextArea', 100, (h, f) => $(h).dxTextArea({ value: 'Multi\nline', height: 70, ...f })],
  ['numberBox', 'NumberBox - spin buttons', 90, (h, f) => $(h).dxNumberBox({ value: 42, label: 'Count', showSpinButtons: true, ...f })],
  ['selectBox', 'SelectBox', 90, (h, f) => $(h).dxSelectBox({ items, value: items[0], label: 'Choice', ...f })],
  ['tagBox', 'TagBox - tags', 90, (h, f) => $(h).dxTagBox({ items, value: [items[0], items[1]], label: 'Products', ...f })],
  ['dateBox', 'DateBox', 90, (h, f) => $(h).dxDateBox({ value: new Date(2026, 0, 15), label: 'Date', ...f })],
  ['lookup', 'Lookup', 90, (h, f) => $(h).dxLookup({ items, value: items[0], label: 'Lookup', ...f })],
  ['accordion', 'Accordion', 110, (h, f) => $(h).dxAccordion({ dataSource: [{ title: 'Title', text: 'Text' }], collapsible: true, ...f })],
  ['list', 'List', 120, (h, f) => $(h).dxList({ items, height: 100, ...f })],
  ['progressBar', 'ProgressBar', 70, (h, f) => $(h).dxProgressBar({ value: 40, min: 0, max: 100, ...f })],
  ['slider', 'Slider', 90, (h, f) => $(h).dxSlider({ value: 40, min: 0, max: 100, label: { visible: true }, ...f })],
  ['toolbar', 'Toolbar', 80, (h, f) => $(h).dxToolbar({ items: [{ text: 'Toolbar text', location: 'before' }, { widget: 'dxButton', options: { text: 'Btn' }, location: 'after' }], ...f })],
  ['dropDownButton', 'DropDownButton', 80, (h, f) => $(h).dxDropDownButton({ text: 'Actions', items, ...f })],
  ['htmlEditor', 'HtmlEditor', 150, (h, f) => $(h).dxHtmlEditor({ value: '<p>Rich text</p>', height: 120, toolbar: { items: ['bold', 'italic'] }, ...f })],

  // --- components that had nothing of their own when the dim was lifted ----------------------
  ['dataGrid', 'DataGrid', 190, (h, f) => $(h).dxDataGrid({ dataSource: [{ id: 1, name: 'Alpha', qty: 3 }, { id: 2, name: 'Beta', qty: 7 }], keyExpr: 'id', showBorders: true, filterRow: { visible: true }, ...f })],
  ['treeView', 'TreeView', 130, (h, f) => $(h).dxTreeView({ items: [{ text: 'Root', expanded: true, items: [{ text: 'Child' }] }], ...f })],
  ['menu', 'Menu', 70, (h, f) => $(h).dxMenu({ items: [{ text: 'File' }, { text: 'Edit' }], ...f })],
  ['tabs', 'Tabs', 80, (h, f) => $(h).dxTabs({ items: [{ text: 'One' }, { text: 'Two' }], ...f })],
  ['calendar', 'Calendar', 300, (h, f) => $(h).dxCalendar({ value: new Date(2026, 0, 15), ...f })],
  ['form', 'Form', 130, (h, f) => $(h).dxForm({ formData: { Name: 'Text', Count: 5 }, items: ['Name', 'Count'], ...f })],
  ['tileView', 'TileView', 140, (h, f) => $(h).dxTileView({ dataSource: [{ text: 'One' }, { text: 'Two' }], height: 110, direction: 'horizontal', ...f })],
  ['gallery', 'Gallery', 130, (h, f) => $(h).dxGallery({ dataSource: ['Alpha', 'Beta'], height: 100, showIndicator: true, showNavButtons: true, ...f })],
  ['stepper', 'Stepper', 100, (h, f) => $(h).dxStepper({ items: [{ label: 'One' }, { label: 'Two' }], ...f })],
  ['colorView', 'ColorView', 230, (h, f) => $(h).dxColorView({ value: '#0f6cbd', ...f })],
  ['filterBuilder', 'FilterBuilder', 110, (h, f) => $(h).dxFilterBuilder({ fields: [{ dataField: 'Name', dataType: 'string' }], value: ['Name', 'contains', 'a'], ...f })],
  ['chat', 'Chat  (hardcoded opacity .5 in base)', 260, (h, f) => $(h).dxChat({ height: 230, width: 280, ...f })],

  // --- the rest of the disable-able surface, so the inventory is complete -------------------
  // dxScrollView is deliberately absent: disabled there is dx-scrollable-disabled, which only
  // switches scrolling off and has no visual state, so it has nothing to compare.
  ['colorBox', 'ColorBox', 90, (h, f) => $(h).dxColorBox({ value: '#0f6cbd', label: 'Colour', ...f })],
  ['dateRangeBox', 'DateRangeBox', 100, (h, f) => $(h).dxDateRangeBox({ value: [new Date(2026, 0, 1), new Date(2026, 0, 8)], labelMode: 'static', ...f })],
  ['fileUploader', 'FileUploader', 150, (h, f) => $(h).dxFileUploader({ selectButtonText: 'Select file', labelText: 'or drop file here', ...f })],
  ['rangeSlider', 'RangeSlider', 90, (h, f) => $(h).dxRangeSlider({ start: 20, end: 60, min: 0, max: 100, ...f })],
  ['pagination', 'Pagination', 80, (h, f) => $(h).dxPagination({ itemCount: 90, pageSize: 10, pageIndex: 2, showNavigationButtons: true, ...f })],
  ['tabPanel', 'TabPanel', 160, (h, f) => $(h).dxTabPanel({ dataSource: [{ title: 'One', text: 'A' }, { title: 'Two', text: 'B' }], height: 130, ...f })],
  ['treeList', 'TreeList', 190, (h, f) => $(h).dxTreeList({ dataSource: [{ id: 1, head: 0, name: 'Root' }, { id: 2, head: 1, name: 'Child' }], keyExpr: 'id', parentIdExpr: 'head', autoExpandAll: true, showBorders: true, ...f })],
  ['cardView', 'CardView', 200, (h, f) => $(h).dxCardView({ dataSource: [{ id: 1, name: 'Alpha' }], keyExpr: 'id', headerPanel: { visible: true }, ...f })],
  ['pivotGrid', 'PivotGrid', 200, (h, f) => $(h).dxPivotGrid({ dataSource: { fields: [{ dataField: 'a', area: 'row' }, { dataField: 'v', area: 'data', summaryType: 'sum' }], store: [{ a: 'x', v: 1 }, { a: 'y', v: 2 }] }, height: 170, ...f })],
  ['splitter', 'Splitter', 130, (h, f) => $(h).dxSplitter({ height: 100, items: [{ text: 'One' }, { text: 'Two' }], ...f })],
  ['scheduler', 'Scheduler', 300, (h, f) => $(h).dxScheduler({ dataSource: [{ text: 'Event', startDate: new Date(2026, 0, 5, 10), endDate: new Date(2026, 0, 5, 11) }], currentDate: new Date(2026, 0, 5), currentView: 'day', height: 260, ...f })],
  ['fileManager', 'FileManager', 300, (h, f) => $(h).dxFileManager({ fileSystemProvider: [{ name: 'Folder', isDirectory: true, items: [{ name: 'file.txt', size: 10 }] }], height: 260, ...f })],
  ['drawer', 'Drawer', 150, (h, f) => $(h).dxDrawer({ opened: true, height: 120, template: () => $('<div>').text('panel'), ...f })],
  ['box', 'Box', 90, (h, f) => $(h).dxBox({ direction: 'row', height: 60, items: [{ ratio: 1, text: 'One' }, { ratio: 1, text: 'Two' }], ...f })],

  // --- the rest of the base the dim used to reach, so it stays visible here ------------------
  ['scrollView', 'ScrollView', 130, (h, f) => { h.innerHTML = '<div style="height:200px">scrollable content</div>'; $(h).dxScrollView({ height: 100, ...f }); }],
  ['loadIndicator', 'LoadIndicator', 80, (h, f) => $(h).dxLoadIndicator({ visible: true, ...f })],
  ['speedDialAction', 'SpeedDialAction', 110, (h, f) => {
    h.style.position = 'relative';
    h.style.minHeight = '80px';
    $(h).dxSpeedDialAction({ icon: 'add', label: 'Add', ...f });
  }],
  ['contextMenu', 'ContextMenu  (opens on demand)', 140,
    // the widget needs an element of its own: built on the host it swallowed the target markup
    // and rendered "right-click target" as its items instead of One/Two
    (h, f) => {
      const target = anchor(h, 'right-click target');
      h.__inst = $('<div>').appendTo(h).dxContextMenu({
        items: [{ text: 'One' }, { text: 'Two', icon: 'save' }],
        target, position: { my: 'top left', at: 'bottom left', of: target },
        ...f,
      }).dxContextMenu('instance');
    }, toggleVisible],
  ['actionSheet', 'ActionSheet  (opens on demand)', 130,
    // the widget must own the host: putting markup in it makes dxActionSheet treat that markup
    // as its items, which is how this case previously showed "sheet target" twice
    (h, f) => { $(h).dxActionSheet({ items: [{ text: 'Save' }, { text: 'Delete' }], usePopover: false, title: 'Choose', ...f }); },
    (h) => { h.__inst = h.__inst || $(h).dxActionSheet('instance'); toggleVisible(h); }],
  // Portalled overlays. They are kept inside their own row (container/position
  // point at the host) so four columns can be compared side by side instead of overlapping.
  ['popup', 'Popup  (opens on demand)', 170, (h, f) => {
    h.__inst = $('<div>').appendTo(h).dxPopup({
      title: 'Popup title', width: 210, height: 130, shading: false,
      container: h, position: { my: 'top left', at: 'top left', of: h },
      contentTemplate: () => $('<div>').text('Popup content'),
      toolbarItems: [{ widget: 'dxButton', toolbar: 'bottom', options: { text: 'OK', stylingMode: 'contained', type: 'default' } }],
      ...f,
    }).dxPopup('instance');
  }, toggleVisible],
  ['popover', 'Popover  (opens on demand)', 130, (h, f) => {
    const target = anchor(h, 'popover target');
    h.__inst = $('<div>').appendTo(h).dxPopover({
      target, container: h, width: 190,
      contentTemplate: () => $('<div>').text('Popover content'),
      ...f,
    }).dxPopover('instance');
  }, toggleVisible],
  ['tooltip', 'Tooltip  (opens on demand)', 120, (h, f) => {
    const target = anchor(h, 'tooltip target');
    h.__inst = $('<div>').appendTo(h).dxTooltip({
      target, container: h,
      contentTemplate: () => $('<div>').text('Tooltip content'),
      ...f,
    }).dxTooltip('instance');
  }, toggleVisible],
  ['loadPanel', 'LoadPanel  (opens on demand)', 130, (h, f) => {
    h.style.position = 'relative';
    h.style.minHeight = '100px';
    h.__inst = $('<div>').appendTo(h).dxLoadPanel({
      message: 'Loading', shading: false,
      container: h, position: { of: h },
      ...f,
    }).dxLoadPanel('instance');
  }, toggleVisible],
  // --- item-level disabled -----------------------------------------------------------------
  // The gallery above disables whole widgets, but the far more common state is a single disabled
  // entry inside an enabled collection. Each case below shows an enabled and a disabled item side
  // by side, so the intended contrast is judged directly rather than inferred.
  ['listItem', 'List  (2nd item disabled)', 110, (h, f) => $(h).dxList({
    items: [{ text: 'Enabled item' }, { text: 'Disabled item', disabled: true }], ...f })],
  ['treeViewItem', 'TreeView  (2nd item disabled)', 110, (h, f) => $(h).dxTreeView({
    items: [{ text: 'Enabled item' }, { text: 'Disabled item', disabled: true }], ...f })],
  // The expander is the point of this case: disabling one item does NOT disable its expander -
  // the node still opens and the arrow stays at full contrast on purpose. Compare with the
  // TreeView case above, where the whole widget is disabled and the arrow is greyed with it.
  ['treeViewItemExpander', 'TreeView  (disabled item that has an expander)', 150, (h, f) => $(h).dxTreeView({
    items: [
      { text: 'Enabled parent', expanded: true, items: [{ text: 'child A' }] },
      { text: 'Disabled parent', expanded: true, disabled: true, items: [{ text: 'child B' }] },
    ], ...f })],
  ['menuItem', 'Menu  (2nd item disabled)', 80, (h, f) => $(h).dxMenu({
    items: [{ text: 'Enabled' }, { text: 'Disabled', disabled: true }], ...f })],
  ['tabsItem', 'Tabs  (2nd item disabled)', 90, (h, f) => $(h).dxTabs({
    items: [{ text: 'Enabled' }, { text: 'Disabled', disabled: true }], ...f })],
  ['buttonGroupItem', 'ButtonGroup  (2nd item disabled)', 80, (h, f) => $(h).dxButtonGroup({
    items: [{ text: 'Enabled' }, { text: 'Disabled', disabled: true }], ...f })],
  ['accordionItem', 'Accordion  (2nd item disabled)', 140, (h, f) => $(h).dxAccordion({
    dataSource: [{ title: 'Enabled', text: 'A' }, { title: 'Disabled', text: 'B', disabled: true }],
    ...f })],
  ['radioGroupItem', 'RadioGroup  (2nd item disabled)', 100, (h, f) => $(h).dxRadioGroup({
    items: [{ text: 'Enabled' }, { text: 'Disabled', disabled: true }], ...f })],
  ['toolbarItem', 'Toolbar  (2nd button disabled)', 80, (h, f) => $(h).dxToolbar({ items: [
    { location: 'before', widget: 'dxButton', options: { text: 'Enabled' } },
    { location: 'before', widget: 'dxButton', options: { text: 'Disabled', disabled: true } },
  ], ...f })],

  // Markup-only blocks: styled through .dx-widget just like a real widget.
  ['badge', 'Badge  (markup)', 70, (h, f) => { h.innerHTML = '<span class="dx-badge">7</span>'; h.classList.add('dx-widget'); if (f.disabled) h.classList.add('dx-state-disabled'); }],
  ['card', 'Card  (markup)', 90, (h, f) => { h.innerHTML = '<div class="dx-card" style="width:180px;padding:8px">Card</div>'; h.classList.add('dx-widget'); if (f.disabled) h.classList.add('dx-state-disabled'); }],
  ['informer', 'Informer  (markup)', 80, (h, f) => { h.innerHTML = '<div class="dx-informer"><div class="dx-informer-icon"></div>Informer</div>'; h.classList.add('dx-widget'); if (f.disabled) h.classList.add('dx-state-disabled'); }],
  ['fieldset', 'Fieldset  (markup)', 110, (h, f) => { h.innerHTML = '<div class="dx-fieldset"><div class="dx-field"><div class="dx-field-label">Label</div><div class="dx-field-value-static">Value</div></div></div>'; h.classList.add('dx-widget'); if (f.disabled) h.classList.add('dx-state-disabled'); }],
  ['splitterBar', 'SplitterBar  (markup)', 70, (h, f) => { h.innerHTML = '<div class="dx-splitter-bar"><div class="dx-splitter-bar-icon"></div></div>'; h.classList.add('dx-widget'); if (f.disabled) h.classList.add('dx-state-disabled'); }],
];

// readonly is not a thing for every component: only those with .dx-state-readonly rules
/* The theme does not have one disabled look for a text editor, it has one per styling mode and
per label mode: the bundle carries separate disabled rules for dx-editor-outlined / -filled /
-underlined and for dx-texteditor-with-label / -with-floating-label, plus dx-label-before and
dx-label-after. A single outlined+static case exercised a fraction of that, so the matrix is
generated instead - every combination the theme distinguishes, in the same order in every column. */
const STYLING_MODES = ['outlined', 'filled', 'underlined'];
const LABEL_MODES = ['static', 'floating', 'hidden', 'outside'];

STYLING_MODES.forEach((stylingMode) => {
  LABEL_MODES.forEach((labelMode) => {
    CASES.push([
      `textBox-${stylingMode}-${labelMode}`,
      `TextBox - ${stylingMode} / label ${labelMode}`,
      100,
      (h, f) => $(h).dxTextBox({ value: 'Value', label: 'Label', stylingMode, labelMode, ...f }),
    ]);
  });
});

// Validation is a separate disabled rule again (dx-invalid), and so is a label put beside the field.
STYLING_MODES.forEach((stylingMode) => {
  CASES.push([
    `textBoxInvalid-${stylingMode}`,
    `TextBox - ${stylingMode} / invalid`,
    110,
    (h, f) => {
      const editor = $(h).dxTextBox({ value: '', label: 'Required', stylingMode, ...f });
      editor.dxTextBox('instance').option('isValid', false);
      editor.dxTextBox('instance').option('validationError', { message: 'Required' });
    },
  ]);
});

CASES.push([
  'textBoxLabelBefore', 'TextBox - label placed before the field', 90,
  (h, f) => $(h).dxTextBox({ value: 'Value', label: 'Label', labelMode: 'outside', labelLocation: 'left', ...f }),
]);

// A disabled tab that is also the selected one has its own rule (dx-tab-selected).
CASES.push([
  'tabsSelectedDisabled', 'Tabs - selected item disabled', 90,
  (h, f) => $(h).dxTabs({ items: [{ text: 'Selected', disabled: true }, { text: 'Plain' }], selectedIndex: 0, ...f }),
]);

// Button carries a disabled rule per styling mode, not one for the widget.
['contained', 'outlined', 'text'].forEach((stylingMode) => {
  ['normal', 'default', 'danger', 'success'].forEach((type) => {
    CASES.push([
      `button-${stylingMode}-${type}`,
      `Button - ${stylingMode} / ${type}`,
      70,
      (h, f) => $(h).dxButton({ text: type, icon: 'save', stylingMode, type, ...f }),
    ]);
  });
});

const READONLY_CASES = new Set([
  ...STYLING_MODES.flatMap((sm) => LABEL_MODES.map((lm) => `textBox-${sm}-${lm}`)),
  'textArea', 'numberBox', 'selectBox', 'tagBox', 'dateBox', 'lookup', 'checkBox',
  'switch', 'htmlEditor', 'textBoxLabelBefore',
]);

// The case SET is chosen by the shell, not derived from the state: in the read-only comparison
// the reference column renders the same twelve components in their normal state, so the columns
// still line up row by row.
const SET = params.get('set') || 'all';
const shown = SET === 'readonly' ? CASES.filter(([id]) => READONLY_CASES.has(id)) : CASES;
const flags = STATE === 'disabled' ? { disabled: true } : (STATE === 'readonly' ? { readOnly: true } : {});

const gallery = document.getElementById('gallery');
// Components that live in a portal cannot be judged while closed, so a case may declare an
// opener. The shell fires it in every column at once - a menu opened in one column and not the
// others would be worse than not showing it at all.
const openers = {};

function buildGallery() {
  shown.forEach(([id, label, height, build, open]) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.minHeight = height + 'px';
  row.dataset.case = id;
  const cap = document.createElement('div');
  cap.className = 'label';
  cap.textContent = label;
  const host = document.createElement('div');
  host.className = 'host';
  row.appendChild(cap); row.appendChild(host); gallery.appendChild(row);
  try {
    build(host, flags);
    if (open) {
      openers[id] = () => open(host, flags);
    }
  } catch (e) { cap.textContent = label + '  [' + e.message + ']'; }
  });

  window.__openable = Object.keys(openers);
  window.__cases = shown.map(([id, label, height]) => ({ id, label, height, judge: judgeability(id) }));
}

// Row geometry, so the shell can align the columns without any column having to clip. Each
// column reports what its own rows need; the shell applies the maximum to all of them.
window.__rowHeights = () => Object.fromEntries([...document.querySelectorAll('.row')]
  .map((row) => [row.dataset.case, Math.ceil(row.getBoundingClientRect().height)]));
window.__setRowHeights = (heights) => {
  document.querySelectorAll('.row').forEach((row) => {
    const h = heights[row.dataset.case];
    if (h) row.style.height = `${h}px`;
  });
};

window.__open = (id) => {
  const fn = openers[id];
  if (!fn) return false;
  try { fn(); return true; } catch (e) { return false; }
};

// Whether a case can be judged here at all. A component that renders nothing, has no text and
// no painted surface of its own, or puts its content in a portal outside the host cannot be
// compared by looking at the host - reporting it as "no disabled state" would be a guess.
function judgeability(id) {
  const host = document.querySelector(`[data-case="${id}"] .host`);
  if (!host) return 'not-rendered';
  if (!host.querySelector('*') && !host.textContent.trim()) return 'not-rendered';

  const hasOwnText = [...host.querySelectorAll('*')].some((e) => [...e.childNodes]
    .some((n) => n.nodeType === 3 && n.textContent.trim()));
  const portalled = /contextMenu|actionSheet|popup|popover|tooltip|toast|loadPanel/i.test(id);

  if (portalled) return 'portalled';
  return hasOwnText ? 'judgeable' : 'no-text';
}


// Colour fingerprint per case. Comparing a generic list of probes turned out to be wrong: it
// picked up the order and the number of elements, so a component that merely renders one extra
// node when disabled looked "repainted". What the eye compares is the multiset of colours, so
// the signature is every element's colour tuple, sorted, plus the element count. When the counts
// differ the columns are not comparable by colour alone and the case is reported as such rather
// than given a verdict.
function effectiveOpacity(el) {
  let o = 1;
  for (let n = el; n && n !== document.body; n = n.parentElement) {
    const v = parseFloat(getComputedStyle(n).opacity);
    if (!Number.isNaN(v)) o *= v;
  }
  return Math.round(o * 100) / 100;
}
// Pseudo-elements have to be read too: Switch paints its whole disabled state on
// .dx-switch-container::before / .dx-switch-handle::before, HtmlEditor covers its toolbar with a
// ::before, and underlined editors draw their line with ::after. Reading elements only reported
// those components as having no disabled styling at all.
// A fully transparent colour serialises either as rgba(0, 0, 0, 0) or as color(srgb 1 1 1 / 0)
// depending on how it was computed. They are the same pixel, so they must compare equal:
// without this the Toolbar looked "repainted" when disabled while being pixel-identical.
function normColour(c) {
  const rgb = c.match(/^rgba?\(([^)]+)\)$/);
  if (rgb) {
    const parts = rgb[1].split(/[,\s/]+/).filter(Boolean);
    return parts.length === 4 && parseFloat(parts[3]) === 0 ? 'transparent' : c;
  }
  const fn = c.match(/^color\([^)]*\/\s*([\d.]+)\s*\)$/);
  return fn && parseFloat(fn[1]) === 0 ? 'transparent' : c;
}

function signature(row) {
  // The widget is created ON the .host element, so the host IS the widget root: querying
  // '.host *' alone left every root-level change - the background and border of a text editor,
  // the dim on the widget root - out of the signature entirely.
  const host = row.querySelector('.host');
  const els = [host, ...host.querySelectorAll('*')];
  const tuples = [];
  els.forEach((el) => {
    const own = getComputedStyle(el);
    if (own.display === 'none' || own.visibility === 'hidden') return;
    const opacity = effectiveOpacity(el);
    ['', '::before', '::after'].forEach((pseudo) => {
      const cs = pseudo ? getComputedStyle(el, pseudo) : own;
      if (pseudo && cs.content === 'none') return;
      tuples.push([pseudo, normColour(cs.color), normColour(cs.backgroundColor),
        normColour(cs.borderTopColor), normColour(cs.borderBottomColor), opacity].join('|'));
    });
  });
  tuples.sort();
  return { count: tuples.length, colours: tuples.join('\n') };
}
// Heavy widgets (scheduler, treeList, fileManager) keep rendering after load, so a single
// snapshot is not trustworthy: components jumped between verdicts run to run. The signature is
// therefore taken twice and published only when two consecutive reads agree; a case that never
// settles is reported as unstable instead of being given a verdict.
function collect() {
  const fp = {};
  document.querySelectorAll('[data-case]').forEach((row) => {
    if (!row.querySelector('.host .dx-widget, .host.dx-widget') && !row.querySelector('.host > *')) return;
    fp[row.dataset.case] = signature(row);
  });
  return fp;
}
/* Widgets must not be built before the theme stylesheet has applied. DevExtreme resolves the
current theme once, at creation, and an unresolved theme falls back to labelMode "outside": the
label span goes absolute, its wrapper collapses to zero width, and the label reads as missing.
That is what made the editors in one column look label-less - a load-order race in this page,
not a defect in either theme. */
const themeApplied = new Promise((resolve) => {
  const link = document.getElementById('theme');
  if (link.sheet) { resolve(); return; }
  link.addEventListener('load', resolve, { once: true });
  link.addEventListener('error', resolve, { once: true });
  setTimeout(resolve, 5000);
});

const galleryBuilt = themeApplied
  .then(() => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))))
  .then(() => { buildGallery(); });

window.addEventListener('load', () => {
  const settle = async () => {
    await galleryBuilt;
    await new Promise((r) => setTimeout(r, 1200));
    let prev = collect();
    for (let attempt = 0; attempt < 6; attempt++) {
      await new Promise((r) => setTimeout(r, 700));
      const next = collect();
      const unstable = Object.keys(next).filter((k) => !prev[k] || prev[k].colours !== next[k].colours);
      if (!unstable.length) { window.__fp = next; window.__unstable = []; window.__ready = true; return; }
      prev = next;
    }
    const last = collect();
    window.__unstable = Object.keys(last).filter((k) => !prev[k] || prev[k].colours !== last[k].colours);
    window.__fp = last;
    window.__ready = true;
  };
  settle();
});
</script>
</body>
</html>
