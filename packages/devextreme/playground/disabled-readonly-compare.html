<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fluent-next: disabled / readonly against legacy fluent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; background: #fff; color: #161616; }
  body.dark { background: #1d1d1d; color: #f5f5f5; color-scheme: dark; }
  .bar { padding: 10px 14px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
         border-bottom: 1px solid rgba(128,128,128,.35); position: sticky; top: 0; background: inherit; z-index: 2; }
  .bar b { font-size: 14px; }
  .bar label { display: inline-flex; gap: 5px; align-items: center; }
  .note { opacity: .65; font-size: 12px; max-width: 100%; padding: 10px 14px; border-bottom: 1px solid rgba(128,128,128,.35); }
  .note code { font-family: ui-monospace, Menlo, monospace; }
  .cols { display: flex; align-items: stretch; overflow-x: auto; }
  .col { flex: 1 1 0; min-width: 260px; border-right: 1px solid rgba(128,128,128,.35); display: flex; flex-direction: column; }
  .col > h2 { margin: 0; padding: 8px 12px; font-size: 12px; font-weight: 600;
              border-bottom: 1px solid rgba(128,128,128,.35); background: rgba(128,128,128,.08); }
  .col > h2 small { display: block; font-weight: 400; opacity: .6; }
  iframe { flex: 1 1 auto; width: 100%; height: calc(100vh - 210px); border: 0; }
  #triggers { font-size: 12px; }
  #triggers button { font: inherit; padding: 3px 10px; border: 1px solid rgba(128,128,128,.5);
                     border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
  #triggers button:hover { background: rgba(128,128,128,.15); }
  #summary { padding: 10px 14px; border-top: 1px solid rgba(128,128,128,.35); font-size: 12px; }
  #summary ul { margin: 6px 0 0; padding-left: 18px; }
  #summary .same { color: #b3261e; }
  body.dark #summary .same { color: #ff8a80; }
</style>
</head>
<body>
  <div class="bar">
    <b>fluent-next: disabled / readonly against legacy fluent</b>
    <span>
      <label><input type="radio" name="state" value="disabled" checked> disabled</label>
      <label><input type="radio" name="state" value="readonly"> readonly</label>
    </span>
    <span>
      <label><input type="radio" name="mode" value="light" checked> light</label>
      <label><input type="radio" name="mode" value="dark"> dark</label>
    </span>
    <span id="status" style="opacity:.6"></span>
  </div>

  <div class="note" id="legend"></div>

  <div class="bar" id="triggers"></div>

  <div class="cols" id="cols"></div>

  <div id="summary">measuring...</div>

<script>
/*
 * Four synchronised columns over the same gallery. Requires the built bundles
 * (pnpm nx build:ci devextreme-scss) and dx.all.debug.js (pnpm nx build:dev devextreme),
 * served over http from the repository root.
 */
const COLUMNS = {
  disabled: [
    { key: 'enabled', title: 'Enabled', sub: 'fluent-next, the reference', theme: 'fluent-next', state: 'enabled' },
    { key: 'subject', title: 'Disabled', sub: 'fluent-next', theme: 'fluent-next', state: 'disabled' },
    { key: 'legacy', title: 'Legacy fluent', sub: 'the shipped theme, for NFR-1', theme: 'fluent', state: 'disabled' },
  ],
  readonly: [
    { key: 'enabled', title: 'Normal', sub: 'fluent-next, the reference', theme: 'fluent-next', state: 'enabled', set: 'readonly' },
    { key: 'subject', title: 'Read-only', sub: 'fluent-next', theme: 'fluent-next', state: 'readonly', set: 'readonly' },
    { key: 'legacy', title: 'Legacy fluent read-only', sub: 'the shipped theme, for NFR-1', theme: 'fluent', state: 'readonly', set: 'readonly' },
  ],
};

const LEGEND = {
  disabled: `fluent-next has no blanket dim: every component paints its disabled state from the disabled
    roles, the way Fluent specifies it. So the question here is simply whether <b>Disabled</b> differs from
    <b>Enabled</b>. Where they look the same, the component paints <em>nothing</em> for the state - that is
    the work list. Legacy fluent still dims everything at 35% and is here for NFR-1: it shows what the state
    used to look like, and a component that reads as disabled there but not here is a regression, not a
    stylistic choice. Cases that live in a portal are opened from the buttons above, in every column at once.`,
  readonly: `Read-only is not a dimmed state in either theme. The comparison is
    fluent-next against legacy fluent. Note that read-only currently shares the <em>border</em> token with
    disabled (<code>--dx-text-editor-border-disabled</code>) while its text keeps full contrast.`,
};

const BUILD = Date.now();
const cols = document.getElementById('cols');
const statusEl = document.getElementById('status');
let frames = [];

function build() {
  const state = document.querySelector('input[name=state]:checked').value;
  const mode = document.querySelector('input[name=mode]:checked').value;
  document.body.classList.toggle('dark', mode === 'dark');
  document.getElementById('legend').innerHTML = LEGEND[state];
  cols.innerHTML = '';
  frames = COLUMNS[state].map((c) => {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `<h2>${c.title}<small>${c.sub}</small></h2>`;
    const f = document.createElement('iframe');
    f.src = `disabled-readonly-compare-frame.html?theme=${c.theme}.blue.${mode}&state=${c.state}&set=${c.set || 'all'}&_=${BUILD}`;
    col.appendChild(f);
    cols.appendChild(col);
    return { cfg: c, el: f };
  });
  syncScroll();
  buildTriggers();
  waitAndSummarise();
}

// A portalled component shows nothing until it is opened, and opening it in one column only
// would leave nothing to compare. Each trigger fires the same case in every column.
async function buildTriggers() {
  const bar = document.getElementById('triggers');
  bar.innerHTML = '<span>Portalled components — open in every column:</span>';

  const deadline = Date.now() + 30000;
  while (Date.now() < deadline
    && !frames.every(({ el }) => el.contentWindow && el.contentWindow.__openable)) {
    await new Promise((r) => setTimeout(r, 250));
  }

  const ids = frames[0]?.el?.contentWindow?.__openable ?? [];

  if (!ids.length) {
    bar.innerHTML += ' <span style="opacity:.6">none in this set</span>';
    return;
  }

  ids.forEach((id) => {
    const button = document.createElement('button');
    button.textContent = id;
    button.addEventListener('click', () => {
      const opened = frames.filter(({ el }) => el.contentWindow.__open?.(id)).length;
      button.textContent = `${id} (${opened}/${frames.length})`;
    });
    bar.appendChild(button);
  });
}

// The per-case heights in the frame are a floor, not a lid: a disabled component can be taller
// than its enabled twin, and the old fixed height simply cut whichever column overflowed. Every
// column reports what its rows need and all of them are given the tallest, so the rows stay
// aligned - which is the whole point of the page - without anything being clipped.
function alignRows() {
  const perColumn = frames
    .map(({ el }) => el.contentWindow.__rowHeights?.())
    .filter(Boolean);

  if (perColumn.length !== frames.length) return;

  const tallest = {};
  perColumn.forEach((heights) => {
    Object.entries(heights).forEach(([id, h]) => {
      tallest[id] = Math.max(tallest[id] ?? 0, h);
    });
  });

  frames.forEach(({ el }) => el.contentWindow.__setRowHeights?.(tallest));
}

// "Did you rebuild?" should not be a question you have to ask. The bundles carry a Build date
// comment; this reads it out of the stylesheet the first column actually loaded, so the page
// says which build it is showing.
async function showBuildStamp() {
  const link = frames[0]?.el?.contentDocument?.getElementById('theme');
  if (!link) return;
  try {
    const response = await fetch(link.href);
    // The Build date comment carries the day only, which cannot tell two builds apart within one
    // day - exactly the case where the question gets asked. Last-Modified is to the second.
    const modified = response.headers.get('last-modified');
    const text = await response.text();
    const stamp = /Build date:\s*([^*\n]+)/.exec(text.slice(0, 2000));
    const when = modified ? new Date(modified).toLocaleString() : stamp?.[1]?.trim();
    statusEl.textContent = when ? `stylesheet built ${when}` : '';
  } catch {
    statusEl.textContent = '';
  }
}

function syncScroll() {
  let busy = false;
  frames.forEach(({ el }) => {
    el.addEventListener('load', () => {
      el.contentWindow.addEventListener('scroll', () => {
        if (busy) return;
        busy = true;
        const top = el.contentWindow.scrollY;
        frames.forEach(({ el: other }) => { if (other !== el) other.contentWindow.scrollTo(0, top); });
        busy = false;
      });
    });
  });
}

async function waitAndSummarise() {
  const summary = document.getElementById('summary');
  summary.textContent = 'measuring...';
  statusEl.textContent = 'loading columns...';
  const deadline = Date.now() + 45000;
  while (Date.now() < deadline) {
    if (frames.every(({ el }) => el.contentWindow && el.contentWindow.__ready)) break;
    await new Promise((r) => setTimeout(r, 250));
  }
  statusEl.textContent = '';
  showBuildStamp();
  alignRows();
  const byKey = Object.fromEntries(frames.map(({ cfg, el }) => [cfg.key, el.contentWindow]));
  if (!byKey.enabled || !byKey.enabled.__fp) { summary.textContent = 'columns did not finish loading'; return; }

  const cases = byKey.enabled.__cases || [];
  const state = document.querySelector('input[name=state]:checked').value;

  // A signature that is missing or not in the expected shape means "not measured". Returning
  // 'same' for it would quietly turn a broken column into a clean bill of health.
  const verdict = (a, b) => {
    const bad = (x) => !x || typeof x !== 'object' || typeof x.colours !== 'string' || typeof x.count !== 'number';
    if (bad(a) || bad(b)) return 'unknown';
    if (a.count !== b.count) return 'structure';
    return a.colours === b.colours ? 'same' : 'different';
  };

  if (state === 'readonly') {
    const rows = cases.map((c) => ({ c, v: verdict(byKey.enabled.__fp[c.id], byKey.subject.__fp[c.id]) }));
    const diff = rows.filter((r) => r.v === 'different' || r.v === 'structure');
    const same = rows.filter((r) => r.v === 'same');
    summary.innerHTML = `<b>Read-only:</b> ${diff.length} of ${cases.length} components render differently from their normal state.`
      + (same.length ? `<ul><li class="same">no visible read-only styling: ${same.map((r) => r.c.id).join(', ')}</li></ul>` : '');
    window.__compare = { state, different: diff.map((r) => r.c.id), same: same.map((r) => r.c.id) };
    return;
  }

  const unstable = new Set(frames.flatMap(({ el }) => el.contentWindow.__unstable || []));
  const rows = cases.map((c) => ({
    c,
    v: unstable.has(c.id) ? 'unstable' : verdict(byKey.enabled.__fp[c.id], byKey.subject.__fp[c.id]),
  }));
  const unpainted = rows.filter((r) => r.v === 'same');
  const owns = rows.filter((r) => r.v === 'different');
  const unclear = rows.filter((r) => r.v === 'structure');
  const unmeasured = rows.filter((r) => r.v === 'unknown');
  const jittery = rows.filter((r) => r.v === 'unstable');

  // A case the gallery cannot judge must not be counted as a missing disabled state: a portalled
  // menu is measured on its host rather than its content, a spinner has nothing to grey, and a
  // case that renders nothing tells us only that the case is broken.
  const judgeOf = Object.fromEntries(cases.map((c) => [c.id, c.judge || 'judgeable']));
  const cannotJudge = unpainted.filter((r) => judgeOf[r.c.id] !== 'judgeable');
  const reallyMissing = unpainted.filter((r) => judgeOf[r.c.id] === 'judgeable');

  summary.innerHTML =
    `<b>${owns.length}</b> of ${cases.length} components render a disabled state of their own; `
    + `<span class="same"><b>${reallyMissing.length}</b> render no disabled state</span>`
    + (cannotJudge.length
      ? `; ${cannotJudge.length} cannot be judged from the host (${cannotJudge.map((r) => `${r.c.id}: ${judgeOf[r.c.id]}`).join(', ')})`
      : '')
    + (unclear.length ? `; ${unclear.length} render a different number of elements and cannot be judged by colour alone` : '')
    + `.<ul>`
    + `<li class="same">no disabled state of their own: ${reallyMissing.map((r) => r.c.id).join(', ') || '-'}</li>`
    + `<li>already on their own disabled colours: ${owns.map((r) => r.c.id).join(', ') || '-'}</li>`
    + (unclear.length ? `<li>compare by eye: ${unclear.map((r) => r.c.id).join(', ')}</li>` : '')
    + (unmeasured.length ? `<li class="same">NOT MEASURED (reload the page): ${unmeasured.map((r) => r.c.id).join(', ')}</li>` : '')
    + (jittery.length ? `<li>still rendering when measured, no verdict: ${jittery.map((r) => r.c.id).join(', ')}</li>` : '')
    + `</ul>`;
  window.__compare = { state, unpainted: unpainted.map((r) => r.c.id), owns: owns.map((r) => r.c.id),
    reallyMissing: reallyMissing.map((r) => r.c.id), cannotJudge: cannotJudge.map((r) => `${r.c.id}:${judgeOf[r.c.id]}`),
    unclear: unclear.map((r) => r.c.id), unmeasured: unmeasured.map((r) => r.c.id),
    jittery: jittery.map((r) => r.c.id) };
}

document.querySelectorAll('input').forEach((r) => r.addEventListener('change', build));
build();
</script>
</body>
</html>
