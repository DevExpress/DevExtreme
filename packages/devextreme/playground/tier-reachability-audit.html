<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fluent-next: runtime reachability audit of the --dx-* tier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="theme" rel="stylesheet" type="text/css" href="../artifacts/css/dx.fluent-next.blue.light.css">
  <script src="../artifacts/js/jquery.js"></script>
  <script src="../artifacts/js/dx-gantt.js"></script>
  <script src="../artifacts/js/dx-diagram.js"></script>
  <script src="../artifacts/js/dx.all.debug.js" charset="utf-8"></script>
  <style>
    body { font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 16px; }
    #report { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; background: #f3f5f7; padding: 12px; border-radius: 6px; }
    #gallery > div { margin: 8px 0; }
    .fail { color: #b00020; }
  </style>
</head>
<body class="dx-viewport">
  <h1>Reachability audit: every rule reading var(--dx-…) must see the variable on the elements it matches</h1>
  <div id="report">initialising…</div>
  <div id="gallery"></div>

  <script>
  /*
   * Method: a CSSOM walk over the bundle — for every rule that reads var(--dx-…) take all the
   * elements of document.querySelectorAll(selector) and check getComputedStyle(el).getPropertyValue(name):
   * an empty string means the variable does not arrive (a reachability hole — exactly the htmlEditor bug).
   * The report is left in window.__auditResult; the page is a standing defence (procedure in TESTING.md).
   */
  async function buildGallery() {
    const g = document.getElementById('gallery');
    const add = (id, html) => { const d = document.createElement('div'); d.id = id; if (html) d.innerHTML = html; g.appendChild(d); return d; };
    const widget = (name, options) => { const d = add('w-' + name.toLowerCase()); try { $(d)[name](options ?? {}); } catch (e) { console.warn(name, e.message); } return d; };

    add('m-badge', '<span class="dx-badge">7</span>');
    add('m-card', '<div class="dx-card" style="width:200px;padding:8px">card</div>');
    add('m-informer', '<div class="dx-informer"><div class="dx-informer-icon"></div>ok</div>');
    add('m-field-standalone', '<div class="dx-field"><div class="dx-field-label">Standalone field</div><div class="dx-field-value-static">v</div></div>');
    add('m-fieldset', '<div class="dx-fieldset"><div class="dx-field"><div class="dx-field-label">L</div><div class="dx-field-value-static">V</div></div></div>');
    add('m-splitterbar', '<div class="dx-splitter-bar"><div class="dx-splitter-bar-icon"></div></div>');

    widget('dxButton', { text: 'Btn', icon: 'home' });
    widget('dxButtonGroup', { items: [{ text: 'a' }, { text: 'b' }] });
    widget('dxTextBox', { label: 'Outlined', stylingMode: 'outlined', value: 'x' });
    widget('dxTextBox', { mode: 'search', value: 'search' });
    widget('dxTextArea', { value: 'ta' });
    widget('dxNumberBox', { showSpinButtons: true, value: 5 });
    widget('dxSwitch', { value: true });
    widget('dxRadioGroup', { items: ['a', 'b'], value: 'a' }); // .dx-radiobutton
    widget('dxProgressBar', { min: 0, max: 100, value: 40 });
    widget('dxLoadIndicator', {});
    widget('dxAccordion', { dataSource: [{ title: 't', text: 'x' }], collapsible: true });
    widget('dxGallery', { dataSource: ['a', 'b'], showIndicator: true, showNavButtons: true, height: 80 });
    widget('dxTileView', { dataSource: [{ text: 't' }], height: 90 });
    widget('dxToolbar', { width: 220, items: [
      { widget: 'dxButton', options: { text: 'A' }, location: 'before' },
      { widget: 'dxButton', options: { text: 'H1' }, locateInMenu: 'always' },
    ] });
    widget('dxMenu', { items: [{ text: 'File', items: [{ text: 'Open' }] }] });
    widget('dxTabPanel', { dataSource: [{ title: 'tab', text: 'x' }], height: 90 });
    widget('dxScrollView', { height: 60 }).innerHTML = '<div style="height:200px">scroll</div>'; // .dx-scrollable
    widget('dxSplitter', { dataSource: [{ text: 'L' }, { text: 'R' }], height: 70, width: 240 });
    widget('dxDropDownButton', { text: 'dd', items: ['x', 'y'] });
    widget('dxSelectBox', { items: ['one'], value: 'one' });
    widget('dxTagBox', { items: ['a', 'b'], value: ['a'] });
    widget('dxDateBox', { value: new Date(2026, 7, 14) });
    widget('dxDateRangeBox', { startDate: new Date(2026, 7, 1), endDate: new Date(2026, 7, 14) });
    widget('dxColorBox', { value: '#0f6cbd' });
    widget('dxLookup', { items: ['a'], value: 'a' });
    widget('dxDataGrid', {
      dataSource: [{ a: 1, b: 'x' }],
      columns: ['a', 'b'],
      columnChooser: { enabled: true },
      filterRow: { visible: true },
      headerFilter: { visible: true },
    });
    widget('dxTreeList', {
      dataSource: [{ id: 1, a: 'x' }],
      columns: ['a'],
      filterRow: { visible: true },
      headerFilter: { visible: true },
    });
    // adaptive menu: the hamburger plus a TreeView in an overlay, which carries no .dx-menu-base
    const am = add('w-adaptive-menu'); am.style.width = '60px';
    $(am).dxMenu({ items: [{ text: 'Items 1', items: [{ text: 'Item 1' }, { text: 'Item 2', icon: 'copy' }] }, { text: 'Items 2' }], adaptivityEnabled: true });
    try { widget('dxCardView', { dataSource: [{ a: 1 }], columns: [{ dataField: 'a', allowHeaderFiltering: true }], headerFilter: { visible: true } }); } catch (e) { console.warn('cardView', e.message); }
    // validation: an invalid editor with its message
    const v = widget('dxTextBox', { value: '' });
    try {
      $(v).dxValidator({ validationRules: [{ type: 'required' }] });
      $(v).dxValidator('instance').validate();
    } catch (e) { console.warn('validator', e.message); } // .dx-invalid-message, .dx-validationsummary
    try { widget('dxHtmlEditor', { value: '<p>x</p>', stylingMode: 'outlined' }); } catch (e) { console.warn('htmlEditor', e.message); }
    // synthetic fallback in case Quill is unavailable: the classes are all the CSS needs
    add('m-htmleditor', '<div class="dx-htmleditor dx-htmleditor-outlined" style="height:40px"></div>');

    // overlays: toast, tooltip, popover, load panel, action sheet, toolbar menu, column chooser, rollers
    widget('dxToast', { message: 'audit', type: 'info', visible: true, displayTime: 600000, animation: null });
    const tt = add('m-tt', '<span>target</span>');
    try { $(add('w-tooltip')).dxTooltip({ target: tt, visible: true, contentTemplate: () => 'tip' }); } catch (e) {}
    try { $(add('w-popover')).dxPopover({ target: tt, visible: true, contentTemplate: () => 'pop' }); } catch (e) {}
    try { $(add('w-loadpanel')).dxLoadPanel({ visible: true, message: 'load' }); } catch (e) {}
    try { $(add('w-actionsheet')).dxActionSheet({ items: [{ text: 'Do' }], visible: true, showCancelButton: true }); } catch (e) {}
    try { $('#w-dxtoolbar .dx-dropdownmenu-button').trigger('dxclick'); } catch (e) {} // .dx-dropdownmenu-popup-wrapper
    try { $('#w-dxdatagrid').dxDataGrid('instance').showColumnChooser(); } catch (e) {}
    // filter menu (operations) in the filter row, header filter, hamburger of the adaptive menu
    try { $('#w-dxdatagrid .dx-filter-menu .dx-menu-item').first().trigger('dxclick'); } catch (e) {}
    try { $('#w-dxdatagrid .dx-header-filter').first().trigger('dxclick'); } catch (e) {}
    try { $('#w-adaptive-menu .dx-menu-hamburger-button, #w-adaptive-menu .dx-button').first().trigger('dxclick'); } catch (e) {}
    try { $('#w-dxcardview .dx-header-filter, #w-dxcardview .dx-cardview-header-filter-indicator').first().trigger('dxclick'); } catch (e) {}
    try { $('#w-dxlookup').dxLookup('instance').open(); } catch (e) {}
    try { $(add('w-rollers')).dxDateBox({ pickerType: 'rollers', value: new Date(2026, 7, 14), opened: true }); } catch (e) {} // .dx-dateview-rollers
    try { $(add('w-ctx')).dxContextMenu({ items: [{ text: 'i1' }], visible: true, target: 'body', position: { of: tt } }); } catch (e) {}
    try { $('#w-dxselectbox').dxSelectBox('instance').open(); } catch (e) {} // .dx-dropdownlist-popup-wrapper, .dx-dropdowneditor-overlay (dropDownEditor/dropDownList)


    /* ---- wave H: the components that entered the tier in the second pass ---- */
    widget('dxBox', { direction: 'row', height: 40, items: [{ ratio: 1, text: 'a' }, { ratio: 1, text: 'b' }] });
    widget('dxCheckBox', { value: true });
    widget('dxSlider', { min: 0, max: 100, value: 40, width: 200 });
    widget('dxRangeSlider', { start: 20, end: 60, width: 200 });
    widget('dxTabs', { dataSource: [{ text: 'one' }, { text: 'two', icon: 'home' }], width: 220 });
    widget('dxList', { items: ['a', 'b'], height: 90, showSelectionControls: true, selectionMode: 'multiple' });
    widget('dxCalendar', { value: new Date(2026, 7, 14), showWeekNumbers: true });
    widget('dxTreeView', { items: [{ text: 'root', expanded: true, items: [{ text: 'leaf' }] }], showCheckBoxesMode: 'normal' });
    widget('dxForm', { formData: { a: 'x' }, items: [{ dataField: 'a', isRequired: true, helpText: 'help' }] });
    widget('dxFilterBuilder', { fields: [{ dataField: 'a', dataType: 'string' }], value: ['a', '=', 'x'] });
    widget('dxFileUploader', { labelText: 'or drop here' });
    widget('dxColorView', { value: '#0f6cbd', editAlphaChannel: true });
    widget('dxStepper', { items: [{ text: 'one' }, { text: 'two' }] });
    widget('dxDrawer', { opened: true, height: 80 });
    /* dxRecurrenceEditor is not registered as a plugin of its own - it warned and built nothing
       here for as long as this line existed. The scheduler's appointment form builds it, and the
       popup below passes a recurrenceRule so that it does. */
    widget('dxChat', { user: { id: 'me' }, items: [
      { id: 1, timestamp: Date.now(), text: 'hi', author: { id: 'a', name: 'A' } },
      { id: 2, timestamp: Date.now(), text: 'yo', author: { id: 'me', name: 'Me' } },
    ] });
    widget('dxPagination', { pageCount: 12, showInfo: true, showNavigationButtons: true,
      showPageSizeSelector: true, allowedPageSizes: [5, 10] });
    widget('dxPivotGrid', { height: 200, fieldChooser: { enabled: true }, fieldPanel: { visible: true },
      dataSource: { store: [{ a: 'x', b: 1 }], fields: [
        { dataField: 'a', area: 'row' }, { dataField: 'b', area: 'data', summaryType: 'count' }] } });
    widget('dxScheduler', { height: 250, views: ['day'], currentView: 'day',
      currentDate: new Date(2026, 7, 14),
      dataSource: [{ text: 'appt', startDate: new Date(2026, 7, 14, 9), endDate: new Date(2026, 7, 14, 10) }] });
    widget('dxFileManager', { height: 250, permissions: { create: true, delete: true, rename: true },
      fileSystemProvider: [{ name: 'folder', isDirectory: true, items: [] }, { name: 'f.txt', size: 1 }] });
    widget('dxGantt', { height: 200, tasks: { dataSource: [
      { id: 1, title: 'task', start: new Date(2026, 7, 10), end: new Date(2026, 7, 14), progress: 30 }] } });
    widget('dxDiagram', { height: 200 });
    // roots with no widget of their own here: the map needs the network, the FAB and timeView are host-built
    add('m-map', '<div class="dx-map-container"><div class="dx-map-shield"></div></div>');
    add('m-fab', '<div class="dx-fa-button"><div class="dx-fa-button-icon"></div></div>');
    add('m-timeview', '<div class="dx-timeview"><div class="dx-timeview-clock"></div><div class="dx-timeview-field"></div></div>');
    add('m-surface', '<div class="dx-surface">surface</div>');
    /*
     * A grid's pager and the standalone widget carry MUTUALLY EXCLUSIVE classes (content.tsx, getClasses):
     * dx-pager in grid-compatibility mode, dx-pagination as a widget of its own. Both must be exercised.
     */
    const pagerGrid = add('w-grid-pager');
    try {
      $(pagerGrid).dxDataGrid({
        dataSource: Array.from({ length: 20 }, (_, i) => ({ a: i })), columns: ['a'],
        paging: { pageSize: 5 },
        pager: { visible: true, showInfo: true, showPageSizeSelector: true,
          allowedPageSizes: [5, 10], showNavigationButtons: true },
      });
    } catch (e) { console.warn('grid pager', e.message); }

    // openers for the satellites of wave H
    try { $('#w-dxpivotgrid').dxPivotGrid('instance').getFieldChooserPopup().show(); } catch (e) { console.warn('field chooser', e.message); }
    try { $('#w-dxfilemanager').dxFileManager('instance').option('permissions.create', true); } catch (e) {}

    // wave H satellites: popups that would otherwise never be built (rootsEmpty reports the remainder)
    try { $('#w-dxcardview').dxCardView('instance').showColumnChooser(); } catch (e) { console.warn('cardView chooser', e.message); }
    /* Twice on purpose: the popup does not build at all when the first call already carries a
       recurrenceRule, and the recurrence form only appears when one is there. Plain first to build
       it, then the rule to fill it. */
    try {
      const sch = $('#w-dxscheduler').dxScheduler('instance');
      const appt = { startDate: new Date(2026, 7, 14, 9), endDate: new Date(2026, 7, 14, 10), text: 'appt' };
      sch.showAppointmentPopup(appt);
      setTimeout(() => {
        try { sch.showAppointmentPopup({ ...appt, recurrenceRule: 'FREQ=MONTHLY;INTERVAL=2;COUNT=5' }, false); } catch (e) { console.warn('recurrence form', e.message); }
      }, 400);
    } catch (e) { console.warn('scheduler popup', e.message); }
    try { $('#w-dxfilterbuilder .dx-filterbuilder-item-field').first().trigger('dxclick'); } catch (e) {}
    try { $('#w-dxfilterbuilder .dx-filterbuilder-item-operation').first().trigger('dxclick'); } catch (e) {}
    try { $('#w-dxlist').dxList('instance').option('menuItems', [{ text: 'Delete' }]); } catch (e) {}
    openTheRest();
    addPortals();
    await new Promise((r) => setTimeout(r, 1600));
  }

  /*
   * Portals: elements JS creates OUTSIDE the root of its widget, so they see the tier only if the root
   * is declared on them as well. Drag states are reproduced with markup rather than gestures: the audit
   * checks that the variable resolves on an element with the right classes in the right place of the
   * tree — exactly what broke in PR #34774 (the column preview without a background, the row clone
   * without a shadow, the AI popup with a black border). Classes and placement come from the sources:
   *   .dx-datagrid-drag-header  — m_columns_resizing_reordering: element().appendTo(swatchContainer)
   *   .dx-sortable-clone/-dragging, .dx-sortable-placeholder — m_draggable/_createDragElement,
   *                                m_sortable/_getPlaceholderElement (container = the viewport)
   *   .dx-ai-chat .dx-aidialog  — grid_core/ai_chat: the wrapperAttr of the Popup
   */
/*
 * Roots the gallery declared but never built. Each one used to be checked over an empty set, which
 * reads as a pass: the audit's own second illness, and the half of G2 that the skip rule does not
 * reach. Opened with the widget's own API wherever there is one, so the markup comes from the
 * product rather than from this file.
 */
  function openTheRest() {
    const g = document.getElementById('gallery');
    const add = (id, html) => { const d = document.createElement('div'); d.id = id; if (html) d.innerHTML = html; g.appendChild(d); return d; };
    const open = (id, widget) => { try { $(id)[widget]('instance').open(); } catch (e) { console.warn(id, e.message); } };
    open('#w-dxcolorbox', 'dxColorBox');              // .dx-colorbox-overlay
    open('#w-dxtagbox', 'dxTagBox');                  // .dx-tagbox-popup-wrapper
    try { $('#w-dxdropdownbutton').dxDropDownButton('instance').toggle(true); } catch (e) { console.warn('dropDownButton', e.message); }
    try { $('#w-dxtreelist').dxTreeList('instance').showColumnChooser(); } catch (e) { console.warn('treeList chooser', e.message); }
    try { $('#w-dxscheduler .dx-scheduler-appointment').first().trigger('dxclick'); } catch (e) {}
    // an action sheet in popover mode carries a wrapper of its own
    const asTarget = add('m-as-target', '<span>as</span>');
    try { $(add('w-actionsheet-popover')).dxActionSheet({ items: [{ text: 'Do' }], usePopover: true, target: asTarget, visible: true }); } catch (e) { console.warn('actionSheet popover', e.message); }
    try { $(add('w-validationsummary')).dxValidationSummary({}); } catch (e) { console.warn('validationSummary', e.message); }
    /*
     * The appointment tooltip has an API and no gesture: a click on an appointment is unreliable
     * here because a 250px day view collapses them into a collector. It needs a scheduler OF ITS
     * OWN - a scheduler shows one overlay at a time, so opening the tooltip on the first one closes
     * the appointment popup and takes 2200 checks with it.
     */
    const s2 = add('w-dxscheduler-tooltip');
    try {
      $(s2).dxScheduler({
        height: 200, views: ['day'], currentView: 'day', currentDate: new Date(2026, 7, 14),
        dataSource: [{ text: 'appt', startDate: new Date(2026, 7, 14, 9), endDate: new Date(2026, 7, 14, 10) }],
      });
      $(s2).dxScheduler('instance').showAppointmentTooltip(
        { text: 'appt', startDate: new Date(2026, 7, 14, 9), endDate: new Date(2026, 7, 14, 10) },
        s2.querySelector('.dx-scheduler-date-table-cell'),
      );
    } catch (e) { console.warn('appointment tooltip', e.message); }
    /*
     * Six roots stay empty on purpose, and not because the gallery is short of a widget:
     * .dx-recurrence-button-group, -datebox-until-date, -numberbox-interval-wrapper,
     * -numberbox-repeat-count, -radiogroup-repeat-type and -repeat-on are emitted by NO JS in the
     * product - neither the sources nor the built bundle contains those strings - while base,
     * fluent and fluent-next all still style them. The scheduler's recurrence form builds
     * dx-scheduler-form-recurrence-* instead. Dead across every theme, so removing them is a job of
     * its own rather than something to fake here.
     */
    // the three mode classes the theme switches on - nothing in a gallery carries them by itself
    add('m-modes', '<div class="dx-theme-mode-light"></div><div class="dx-theme-mode-dark"></div><div class="dx-theme-mode-inverted"></div>');
  }

  function addPortals() {
    const viewport = document.querySelector('.dx-viewport') || document.body;
    const portal = document.createElement('div');
    portal.id = 'portals';
    portal.innerHTML = `
      <div class="dx-datagrid-drag-header">Employee</div>
      <div class="dx-treelist-drag-header">Employee</div>
      <div class="dx-sortable-dragging dx-sortable-clone">
        <div class="dx-datagrid dx-datagrid-dragview"><div class="dx-datagrid-rowsview"><table><tr class="dx-row dx-data-row"><td>row</td></tr></table></div></div>
      </div>
      <div class="dx-sortable-placeholder dx-sortable-placeholder-inside"></div>
      <div class="dx-overlay-wrapper dx-ai-chat dx-aidialog">
        <div class="dx-overlay-content"><div class="dx-ai-chat dx-ai-chat__content">
          <div class="dx-ai-chat__message dx-ai-chat__message--success">
            <div class="dx-ai-chat__message-icon"></div><div class="dx-ai-chat__message-status">ok</div>
            <div class="dx-ai-chat__action-list"><div class="dx-ai-chat__action-list-item dx-ai-chat__action-list-item--success">done</div></div>
          </div>
          <div class="dx-ai-chat__message dx-ai-chat__message--error">
            <div class="dx-ai-chat__message-icon"></div><div class="dx-ai-chat__message-error-text">err</div>
            <div class="dx-ai-chat__action-list-item dx-ai-chat__action-list-item--error">failed</div>
            <div class="dx-ai-chat__action-list-item dx-ai-chat__action-list-item--aborted">aborted</div>
          </div>
          <div class="dx-ai-chat__message dx-ai-chat__message--pending">
            <div class="dx-ai-chat__message-icon"></div><div class="dx-ai-chat__message-status">…</div>
          </div>
          <div class="dx-ai-chat__message-regenerate-button"></div>
          <div class="dx-chat"><div class="dx-chat-messagegroup dx-chat-messagegroup-alignment-start"><div class="dx-chat-messagebubble">bubble</div></div></div>
          <div class="dx-progressbar dx-ai-prompt-editor__progressbar"><div class="dx-progressbar-animating-container"></div></div>
        </div></div>
      </div>
      <div class="dx-sortable-placeholder dx-cardview-header-item-sort-indicator"></div>
      <div class="dx-scheduler-overlay-panel">
        <div class="dx-overlay-content"><div class="dx-list"><div class="dx-list-item">
          <div class="dx-tooltip-appointment-item">
            <div class="dx-tooltip-appointment-item-marker"><div class="dx-tooltip-appointment-item-marker-body"></div></div>
            <div class="dx-tooltip-appointment-item-content">
              <div class="dx-tooltip-appointment-item-content-subject">Subject</div>
              <div class="dx-tooltip-appointment-item-content-date">10:00 AM</div>
            </div>
            <div class="dx-tooltip-appointment-item-delete-button"><div class="dx-icon"></div></div>
          </div>
        </div></div></div>
      </div>
      <div class="dx-sortable-dragging dx-sortable-clone">
        <div class="dx-treeview-item"><span>File.txt</span></div>
      </div>
      <div class="dx-sortable-dragging dx-sortable-clone">
        <div class="dx-cardview-header-item">
          <span class="dx-cardview-header-item-text">Column</span>
          <div class="dx-cardview-header-item-sorting-order">1</div>
          <div class="dx-icon dx-header-filter-icon--selected"></div>
        </div>
      </div>
      <div class="dx-overlay-wrapper dx-aidialog dx-popup-wrapper">
        <div class="dx-overlay-content">
          <div class="dx-aidialog-title">title</div>
          <div class="dx-aidialog-content">body</div>
          <div class="dx-aidialog-controls"><div class="dx-selectbox"></div></div>
        </div>
      </div>
      <div class="dx-overlay-wrapper">
        <div class="dx-overlay-content dx-messagelist-context-menu-content">
          <div class="dx-menu-item dx-state-focused"><div class="dx-icon dx-icon-trash"></div>delete</div>
        </div>
      </div>
      <div class="dx-overlay-wrapper dx-popup-wrapper dx-chat-confirmation-popup-wrapper">
        <div class="dx-overlay-content"><div class="dx-popup-content">delete?</div>
          <div class="dx-popup-bottom dx-toolbar"><div class="dx-toolbar-items-container"></div></div></div>
      </div>
      <div class="dx-overlay-wrapper dx-popup-wrapper dx-htmleditor-add-image-popup">
        <div class="dx-overlay-content"><div class="dx-popup-content">
          <div class="dx-form"><div class="dx-collection"><div class="dx-field-item"><div class="dx-field-item-label-text">URL</div></div></div></div>
          <div class="dx-fileuploader"><div class="dx-fileuploader-input-wrapper"><div class="dx-fileuploader-input-label">drop</div></div></div>
        </div></div>
      </div>
      <div class="dx-overlay-wrapper dx-popup-wrapper dx-filemanager-dialog-popup dx-filemanager-dialog-name-editor-popup">
        <div class="dx-overlay-content"><div class="dx-popup-content"><div class="dx-textbox dx-texteditor"></div></div></div>
      </div>
      <div class="dx-overlay-wrapper dx-popup-wrapper dx-diagram-properties-popup">
        <div class="dx-overlay-content"><div class="dx-diagram-properties-panel-group-title">group</div>
          <div class="dx-diagram-properties-panel-group-toolbar dx-toolbar"><div class="dx-toolbar-item"></div></div></div>
      </div>
      <div class="dx-overlay-wrapper dx-popup-wrapper dx-diagram-toolbox-popup">
        <div class="dx-overlay-content"><div class="dx-diagram-toolbox-input"><div class="dx-button"><div class="dx-button-content"></div><div class="dx-icon"></div></div></div></div>
      </div>
      <div class="dx-overlay-content dx-list-context-menucontent"><div class="dx-list-items"></div></div>
      <div class="dx-cardview-column-chooser-list"><div class="dx-empty-message">empty</div></div>
      <div class="dx-cardview-column-chooser-plain"><div class="dx-treeview"><div class="dx-treeview-select-all-item"></div></div></div>
      <div class="dx-datagrid"><table><tr><td class="dx-command-ai-header-button"><div class="dx-button dx-state-focused">AI</div></td></tr></table></div>
      <div class="dx-overlay-wrapper dx-popup-wrapper dx-datagrid-ai-assistant-confirm-dialog">
        <div class="dx-overlay-content"><div class="dx-popup-content">confirm?</div></div>
      </div>
      <div class="dx-overlay-wrapper dx-popup-wrapper dx-treelist-ai-assistant-confirm-dialog">
        <div class="dx-overlay-content"><div class="dx-popup-content">confirm?</div></div>
      </div>
      <div class="dx-overlay-wrapper dx-diagram-contextmenu">
        <div class="dx-overlay-content"><div class="dx-menu-item">item</div></div>
      </div>
      <div class="dx-overlay-wrapper dx-popup-wrapper dx-diagram-toolbox-popup dx-diagram-mobile-popup">
        <div class="dx-overlay-content"><div class="dx-popup-content">toolbox</div></div>
      </div>
      <div class="dx-overlay-wrapper dx-popup-wrapper dx-diagram-context-toolbox">
        <div class="dx-overlay-content"><div class="dx-popup-content">context toolbox</div></div>
      </div>
      <div class="dx-toast-stack"><div class="dx-toast dx-toast-info"><div class="dx-toast-icon"></div><div class="dx-toast-message">stacked</div></div></div>
      <div class="dx-toolbar dx-toolbar-background"><div class="dx-toolbar-items-container"></div></div>`;
    viewport.appendChild(portal);
  }

  /*
   * The gallery builds every widget at rest, so selectors carrying .dx-state-disabled match almost
   * nothing and are skipped in silence. The class is dropped from the probe instead: no rule in the
   * bundle declares a --dx-* inside a disabled scope, so dropping it cannot change which
   * declarations reach an element. A compound left empty becomes `*`, keeping the ancestor.
   */
  const STATE_CLASS = '.dx-state-disabled';
  const probeSelector = (selectorText) => selectorText
    .split(',')
    .map((one) => one
      .replace(/::?[a-z-]+(\([^)]*\))?/g, '')
      .split(/(\s*[>+~]\s*|\s+)/)
      .map((part, index) => (index % 2 || !part.includes(STATE_CLASS)
        ? part
        : part.split(STATE_CLASS).join('') || '*'))
      .join('')
      .trim())
    .filter(Boolean)
    .join(',');

  function audit() {
    const failures = new Map();
    /*
     * A skipped check used to be a single counter, and a counter cannot tell the difference between
     * a name that is verified twenty times elsewhere and one that is never verified at all. The
     * second is the blind spot: every element carrying it was a closed overlay, so nothing about
     * that name has ever been checked. Counted per name, with the selectors that were skipped.
     */
    const seenPerName = new Map();   // name -> { ok, skipped, where:Set }
    const note = (name, key, field) => {
      if (!seenPerName.has(name)) seenPerName.set(name, { ok: 0, skipped: 0, where: new Set() });
      const row = seenPerName.get(name);
      row[field] += 1;
      if (field === 'skipped' && row.where.size < 4) row.where.add(key);
    };
    const failures2 = failures;
    let rulesChecked = 0;
    let readsChecked = 0;
    let notRendered = 0;
    let stateProbed = 0;
    for (const sheet of document.styleSheets) {
      let rules;
      try { rules = sheet.cssRules; } catch (e) { continue; }
      const walk = (list) => {
        for (const rule of list) {
          /* CSS Nesting: style rules ALWAYS have cssRules (even an empty list) — recursing
             does not replace handling the rule itself, or only the keyframe tail is seen */
          if (rule.cssRules?.length) walk(rule.cssRules);
          if (!rule.style || !rule.selectorText) continue;
          // runtime contract: JS sets these names conditionally (style.setProperty), and with no value
          // the declaration is meant to disappear — emptiness here is the design, not a hole
          const RUNTIME_CONTRACT = ['--dx-cardview-cardsperrow', '--dx-cardview-card-min-width',
            '--dx-cardview-card-max-width', '--dx-cardview-card-cover-ratio',
            '--dx-cardview-card-cover-max-height', '--dx-scheduler-animation-top'];
          /* The accent ramp is derived from --dx-accent-color, which the HOST page sets: the blue
             bundle ships the derivation and no source, so empty here is the contract, not a hole. */
          const isAccent = (n) => n.startsWith('--dx-accent-');
          const reads = [...rule.cssText.matchAll(/var\(\s*(--dx-[a-z0-9-]+)/g)]
            .map((m) => m[1])
            .filter((n) => !n.startsWith('--dxds-') && !RUNTIME_CONTRACT.includes(n) && !isAccent(n));
          if (!reads.length) continue;
          rulesChecked += 1;
          let matched;
          if (rule.selectorText.includes(STATE_CLASS)) stateProbed += 1;
          try { matched = document.querySelectorAll(probeSelector(rule.selectorText) || rule.selectorText); } catch (e) { continue; }
          for (const el of matched) {
            /*
             * Only ONE kind of invisible element cannot be judged: the content of an overlay that
             * has never been shown. It still sits inline in the widget, OUTSIDE the wrapper that
             * carries the component root, so the variable legitimately does not reach it THERE and
             * would reach it once the overlay opens.
             *
             * Everything else that is merely invisible - a display:none pull-down, an empty grid's
             * no-data panel, the off label of a switch that is on - is already in its final place in
             * the tree, and a custom property resolves on it whether or not it paints. Skipping
             * those was the blind spot (G2): 1590 of the 2152 skips were of that kind, and checking
             * them finds zero holes, which is the point - they were never in doubt, they were
             * simply never asked.
             */
            const inOverlay = el.closest('.dx-overlay-content');
            if (!el.getClientRects().length && inOverlay && !inOverlay.closest('.dx-overlay-wrapper')) {
              notRendered += 1;
              for (const name of reads) note(name, rule.selectorText.slice(0, 70), 'skipped');
              continue;
            }
            const cs = getComputedStyle(el);
            for (const name of reads) {
              readsChecked += 1;
              note(name, rule.selectorText.slice(0, 70), 'ok');
              if (cs.getPropertyValue(name).trim() === '') {
                const key = `${name} @ ${rule.selectorText.slice(0, 90)}`;
                if (!failures.has(key)) failures.set(key, el.className.toString().slice(0, 80));
              }
            }
          }
        }
      };
      walk(rules);
    }
    /*
     * The gallery's second illness: a root is declared but no element on the page carries it — there is
     * nothing to check and the audit is green over an empty set. The roots come from the bundle itself
     * (a rule declaring --dx-* IS a root), so no registry is needed here.
     */
    const rootsEmpty = [];
    for (const sheet of document.styleSheets) {
      let rules; try { rules = sheet.cssRules; } catch (e) { continue; }
      for (const rule of rules) {
        if (!rule.style || !rule.selectorText) continue;
        const declares = [...rule.style].some((prop) => prop.startsWith('--dx-') && !prop.startsWith('--dxds-'));
        if (!declares) continue;
        for (const sel of rule.selectorText.split(',')) {
          const one = sel.trim();
          if (one === ':root') continue;
          let n = 0; try { n = document.querySelectorAll(one).length; } catch (e) { continue; }
          if (!n) rootsEmpty.push(one);
        }
      }
    }
    /* The names nothing ever checked: every element that could have carried them was unbuilt. */
    const unchecked = [...seenPerName]
      .filter(([, row]) => row.ok === 0 && row.skipped > 0)
      .map(([name, row]) => ({ name, skipped: row.skipped, where: [...row.where] }))
      .sort((a, b) => a.name.localeCompare(b.name));
    return { rulesChecked, readsChecked, notRendered, stateProbed, unchecked,
      rootsEmpty: [...new Set(rootsEmpty)].sort(), failures: [...failures.entries()] };
  }

  (async () => {
    await buildGallery();
    const result = audit();
    window.__auditResult = result;
    const el = document.getElementById('report');
    el.innerHTML = `rules reading the tier: ${result.rulesChecked}; checks (element × name): ${result.readsChecked}; \nnot rendered (closed overlays, not judged): ${result.notRendered}\nprobed with ${STATE_CLASS} dropped: ${result.stateProbed}\n`
      + (result.unchecked.length
        ? `<span class="fail">NEVER CHECKED: ${result.unchecked.length} name(s)</span> — every element that reads them was unbuilt:\n`
          + result.unchecked.map((u) => `  · ${u.name} (×${u.skipped})  ${u.where[0] ?? ''}`).join('\n') + '\n'
        : '✔ every name the tier reads was checked on at least one built element\n')
      + (result.rootsEmpty.length
        ? `<span class="fail">ROOTS WITH NO ELEMENT: ${result.rootsEmpty.length}</span> — the gallery never builds them, so they are checked over an empty set:\n`
          + result.rootsEmpty.map((s) => `  · ${s}`).join('\n') + '\n'
        : '✔ every declared root is built by at least one element\n')
      + (result.failures.length
        ? `<span class="fail">HOLES: ${result.failures.length}</span>\n` + result.failures.map(([k, cls]) => `✘ ${k}\n    on element: ${cls}`).join('\n')
        : '✔ no holes: every readable variable is visible to its elements');
  })();
  </script>
</body>
</html>
