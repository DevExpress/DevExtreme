<!DOCTYPE html>
<html lang="en">
<head>
  <title>fluent-next: disabled states audit (axe color-contrast)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="theme" rel="stylesheet" type="text/css" href="../artifacts/css/dx.fluent-next.blue.light.css">
  <script src="../artifacts/js/jquery.js"></script>
  <script src="../artifacts/js/dx.all.debug.js" charset="utf-8"></script>
  <script src="../../../node_modules/axe-core/axe.min.js"></script>
  <style>
    body { font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 16px; }
    #report { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; background: #f3f5f7; color: #161616; padding: 12px; border-radius: 6px; }
    #gallery { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    #gallery > div { min-width: 220px; }
    .case-title { font-size: 11px; opacity: .6; margin-bottom: 2px; }
  </style>
</head>
<body class="dx-viewport">
  <h1>Disabled states audit: which dimmed nodes axe still checks</h1>
  <div id="report">initialising…</div>
  <div id="gallery"></div>

  <script>
  /*
   * Method. The gallery renders every disabled state the theme paints: whole widgets with
   * disabled: true, item-level disabled states, and the sub-parts that only get a CSS class.
   * Then axe runs with runOnly: 'color-contrast'.
   *
   * axe skips an element when it, or any ancestor, is disabled in the sense of
   * axe-core `isDisabled`: a `disabled` attribute on fieldset/button/select/input/textarea,
   * or aria-disabled="true" on anything. Everything else is judged as ordinary text, and the
   * theme dims it either with the global opacity or with the disabled colour roles - both land
   * around 2.1-2.3:1 in light, which is by design for Fluent and exempt under WCAG 1.4.3 only
   * while the component reads as inactive.
   *
   * So every violation below is classified:
   *   A - the node IS inside a disabled composite but no ancestor carries the disabled marker
   *       -> markup defect: aria-disabled sits on _getAriaTarget(), not on the widget root
   *   B - the node is NOT disabled at all but is painted with a disabled role
   *       -> real contrast bug, the suppression that hides it is wrong
   * The result is left in window.__disabledAudit.
   */
  const CASES = [];
  const addCase = (id, note, build) => CASES.push({ id, note, build });

  // --- whole widgets with disabled: true -------------------------------------------------
  const W = (name, options) => (host) => { $(host)[name]({ ...options, disabled: true }); };

  addCase('tagBox', 'text editor family: aria target is the <input>', W('dxTagBox', {
    items: ['Alpha', 'Beta'], value: ['Alpha', 'Beta'], label: 'Products',
  }));
  addCase('textBox', 'plain text editor with label and placeholder', W('dxTextBox', {
    value: 'Value', label: 'Label', placeholder: 'Placeholder',
  }));
  addCase('selectBox', 'select box with label', W('dxSelectBox', {
    items: ['One', 'Two'], value: 'One', label: 'Choice',
  }));
  addCase('dateRangeBox', 'two inputs, labels and separator outside them', W('dxDateRangeBox', {
    value: [new Date(2026, 0, 1), new Date(2026, 0, 8)], labelMode: 'static',
  }));
  addCase('fileUploader', 'aria target is the select-file button', W('dxFileUploader', {
    selectButtonText: 'Select file', labelText: 'or drop file here',
  }));
  addCase('lookup', 'aria target is the field', W('dxLookup', {
    items: ['One', 'Two'], value: 'One', label: 'Lookup',
  }));
  addCase('numberBox', 'spin buttons', W('dxNumberBox', { value: 42, label: 'Count', showSpinButtons: true }));
  addCase('checkBox', 'check box with text', W('dxCheckBox', { value: true, text: 'Checked' }));
  addCase('radioGroup', 'radio group items', W('dxRadioGroup', { items: ['One', 'Two'], value: 'One' }));
  addCase('switch', 'switch captions', W('dxSwitch', { value: true }));
  addCase('button', 'contained button', W('dxButton', { text: 'Disabled', icon: 'home' }));
  addCase('list', 'aria target is the item container', W('dxList', {
    items: ['Alpha', 'Beta'], height: 90,
  }));
  addCase('accordion', 'accordion titles', W('dxAccordion', {
    dataSource: [{ title: 'Title', text: 'Text' }], collapsible: true,
  }));
  addCase('tabs', 'tab captions', W('dxTabs', { items: [{ text: 'One' }, { text: 'Two' }] }));
  addCase('menu', 'menu items', W('dxMenu', { items: [{ text: 'File' }, { text: 'Edit' }] }));
  addCase('treeView', 'tree view nodes', W('dxTreeView', {
    items: [{ text: 'Root', expanded: true, items: [{ text: 'Child' }] }],
  }));
  addCase('calendar', 'aria target is the views wrapper', W('dxCalendar', { value: new Date(2026, 0, 1) }));
  addCase('form', 'aria target is the first tabbable field', W('dxForm', {
    formData: { Name: 'Text' }, items: ['Name'],
  }));
  addCase('progressBar', 'progress bar status text', W('dxProgressBar', { value: 40, min: 0, max: 100 }));
  addCase('slider', 'slider labels', W('dxSlider', { value: 40, min: 0, max: 100, label: { visible: true } }));
  addCase('toolbar', 'toolbar with a text item', W('dxToolbar', {
    items: [{ text: 'Toolbar text', location: 'before' }, { widget: 'dxButton', options: { text: 'Btn' }, location: 'after' }],
  }));
  addCase('dropDownButton', 'drop down button text', W('dxDropDownButton', { text: 'Actions', items: ['a'] }));
  addCase('buttonGroup', 'aria target is the PARENT of the widget', W('dxButtonGroup', {
    items: [{ text: 'One' }, { text: 'Two' }], selectedItemKeys: ['One'], keyExpr: 'text',
  }));
  addCase('chat', 'hardcoded opacity .5 in base', W('dxChat', { height: 160, width: 260 }));

  // --- item-level disabled inside an ENABLED widget ---------------------------------------
  addCase('listItemDisabled', 'single disabled item, widget enabled', (host) => {
    $(host).dxList({ items: [{ text: 'Enabled' }, { text: 'Disabled', disabled: true }], height: 90 });
  });
  addCase('menuItemDisabled', 'single disabled menu item', (host) => {
    $(host).dxMenu({ items: [{ text: 'Enabled' }, { text: 'Disabled', disabled: true }] });
  });
  addCase('tabsItemDisabled', 'single disabled tab', (host) => {
    $(host).dxTabs({ items: [{ text: 'Enabled' }, { text: 'Disabled', disabled: true }] });
  });
  addCase('treeViewItemDisabled', 'single disabled node', (host) => {
    $(host).dxTreeView({ items: [{ text: 'Enabled' }, { text: 'Disabled', disabled: true }] });
  });
  addCase('stepperStepDisabled', 'single disabled step', (host) => {
    $(host).dxStepper({ items: [{ label: 'Enabled' }, { label: 'Disabled', disabled: true }] });
  });

  // --- sub-parts that only get a CSS class, with no disabled marker at all -----------------
  addCase('paginationFirstPage', 'nav buttons carry dx-button-disable only', (host) => {
    $(host).dxPagination({ itemCount: 30, pageSize: 10, pageIndex: 0, showNavigationButtons: true });
  });
  addCase('gridDisabledLinks', 'grid command links get dx-state-disabled only', (host) => {
    $(host).dxDataGrid({
      dataSource: [{ id: 1, name: 'Row one' }, { id: 2, name: 'Row two' }],
      keyExpr: 'id',
      editing: { mode: 'row', allowUpdating: (e) => e.row.data.id === 1, allowDeleting: (e) => e.row.data.id === 1 },
      showBorders: true,
    });
  });
  addCase('cardViewDragSource', 'sortable source painted with disabled roles (class B)', (host) => {
    $(host).dxCardView({
      dataSource: [{ id: 1, name: 'Card' }],
      keyExpr: 'id',
      headerPanel: { visible: true },
    });
    // The .dx-sortable-source class is what a drag applies; reproduce it statically.
    setTimeout(() => {
      $(host).find('.dx-cardview-header-item').first().addClass('dx-sortable-source');
    }, 0);
  });
  addCase('readOnlyEditor', 'read-only reuses the disabled border token (class D)', (host) => {
    $(host).dxTextBox({ value: 'Read only', label: 'Label', readOnly: true });
  });

  function buildGallery() {
    const g = document.getElementById('gallery');
    CASES.forEach(({ id, note, build }) => {
      const wrap = document.createElement('div');
      wrap.innerHTML = '<div class="case-title">' + id + ' - ' + note + '</div>';
      const host = document.createElement('div');
      host.setAttribute('data-case', id);
      wrap.appendChild(host);
      g.appendChild(wrap);
      try { build(host); } catch (e) { console.warn(id, e.message); wrap.querySelector('.case-title').textContent += ' [FAILED: ' + e.message + ']'; }
    });
  }

  // Mirrors axe-core `isDisabled`: a disabled attribute on the listed elements, or aria-disabled.
  const DISABLED_NODE_NAMES = ['FIELDSET', 'BUTTON', 'SELECT', 'INPUT', 'TEXTAREA'];
  function disabledMarkerAncestor(el) {
    for (let n = el; n && n.nodeType === 1; n = n.parentElement) {
      if (DISABLED_NODE_NAMES.includes(n.nodeName) && n.hasAttribute('disabled')) return n;
      const aria = n.getAttribute('aria-disabled');
      if (aria !== null) return aria.toLowerCase() === 'true' ? n : null;
    }
    return null;
  }
  function looksDisabled(el) {
    return !!el.closest('.dx-state-disabled, .dx-button-disable');
  }
  function describe(el) {
    const cls = (el.className || '').toString().split(/\s+/).filter(Boolean).slice(0, 4).join('.');
    return el.nodeName.toLowerCase() + (cls ? '.' + cls : '');
  }
  function caseOf(el) {
    const host = el.closest('[data-case]');
    return host ? host.getAttribute('data-case') : '(outside gallery)';
  }

  async function run() {
    const theme = document.getElementById('theme').getAttribute('href').match(/dx\.([^/]+)\.css$/)[1];
    const results = await axe.run(document.getElementById('gallery'), { runOnly: 'color-contrast' });

    const collect = (list, kind) => {
      const rows = [];
      list.forEach((v) => {
        v.nodes.forEach((n) => {
          const el = document.querySelector(n.target[0]);
          if (!el) return;
          const check = (n.any && n.any[0]) || (n.none && n.none[0]) || {};
          const data = check.data || {};
          const marker = disabledMarkerAncestor(el);
          const dimmed = looksDisabled(el);
          rows.push({
            kind,
            case: caseOf(el),
            node: describe(el),
            fg: data.fgColor || '-', bg: data.bgColor || '-',
            ratio: data.contrastRatio === undefined ? '-' : data.contrastRatio,
            reason: kind === 'incomplete' ? (check.message || data.messageKey || '') : '',
            dimmed,
            markerSeenByAxe: !!marker,
            klass: dimmed ? (marker ? 'skipped?' : 'A') : 'B',
          });
        });
      });
      return rows;
    };

    const violations = collect(results.violations, 'violation');
    const incomplete = collect(results.incomplete, 'incomplete');
    const rows = violations.concat(incomplete);

    // Second, independent measurement: does the widget ROOT carry a marker axe accepts?
    const placement = [];
    document.querySelectorAll('[data-case]').forEach((host) => {
      const id = host.getAttribute('data-case');
      const root = host.classList.contains('dx-widget') ? host : host.querySelector('.dx-widget');
      if (!root) { placement.push({ case: id, notRendered: true }); return; }
      const marked = Array.from(host.querySelectorAll('[aria-disabled="true"]'))
        .concat(host.matches('[aria-disabled="true"]') ? [host] : []);
      placement.push({
        case: id,
        dimmedRoot: root.classList.contains('dx-state-disabled'),
        rootMarked: root.getAttribute('aria-disabled') === 'true',
        markedNodes: marked.map(describe),
      });
    });

    window.__disabledAudit = { theme, rows, placement, totals: {
      violations: violations.length,
      incomplete: incomplete.length,
      classA: rows.filter((r) => r.klass === 'A').length,
      classB: rows.filter((r) => r.klass === 'B').length,
      dimmedRootsWithoutMarker: placement.filter((p) => p.dimmedRoot && !p.rootMarked).length,
    } };

    const t = window.__disabledAudit.totals;
    const fmt = (r) => `${r.klass.padEnd(9)} ${r.kind.padEnd(11)} ${r.case.padEnd(22)} ${String(r.ratio).padEnd(6)} ${String(r.fg).padEnd(18)} on ${String(r.bg).padEnd(18)} ${r.node}${r.reason ? '  // ' + r.reason : ''}`;
    document.getElementById('report').textContent = [
      `theme: ${theme}`,
      `violations: ${t.violations}   incomplete: ${t.incomplete}   A: ${t.classA}   B: ${t.classB}`,
      `dimmed widget roots WITHOUT a marker axe accepts: ${t.dimmedRootsWithoutMarker} of ${placement.filter((p) => p.dimmedRoot).length}`,
      '',
      'class     kind        case                   ratio  foreground         background         node',
      ...rows.map(fmt),
      '',
      'aria-disabled placement (widget root vs where it actually landed):',
      ...placement.map((p) => p.notRendered
        ? `  ${p.case.padEnd(22)} (not rendered)`
        : `  ${p.case.padEnd(22)} dimmedRoot=${String(p.dimmedRoot).padEnd(5)} rootMarked=${String(p.rootMarked).padEnd(5)} marked: ${p.markedNodes.join(', ') || '(none)'}`),
    ].join('\n');
  }

  window.addEventListener('load', () => {
    buildGallery();
    setTimeout(run, 600);
  });
  </script>
</body>
</html>
