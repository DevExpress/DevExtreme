packages:
  - 'apps/*'
  - 'e2e/*'
  - 'packages/*'
  - '!packages/sbom'
  - 'tools/*'

linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false
packageManagerStrict: false
engineStrict: true

# Supply-chain guard: ignore npm versions published less than 24 hours ago.
# Need a fresher version? Add a targeted minimumReleaseAgeExclude entry with the exact version.
minimumReleaseAge: 1440 # ⚠️ Do NOT modify this.

minimumReleaseAgeExclude:
  - "devextreme-internal-tools@22.1.0"
  - "@devexpress/design-tokens-internal@262.26.0"
  - "devexpress-diagram"
  - "devexpress-gantt"
  - "@devexpress/utils"
  - "eslint-config-devextreme@2.0.2"
  - "devextreme-exceljs-fork@5.0.0"

overrides:
  "js-yaml@<4.3.2": "^4.3.2"
  "rollup@<4.59.0": "^4.59.0"
  qs: ">=6.16.1"
  "minimatch@>=7.0.0 <11.0.1": file:./tools/minimatch-v7-v10-patch
  "micromatch@<4.0.8": ^4.0.8
  "esbuild@<0.28.1": ^0.28.1
  "tmp@<0.2.7": "^0.2.7"
