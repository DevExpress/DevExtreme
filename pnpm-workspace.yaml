packages:
  - 'apps/*'
  - 'e2e/*'
  - 'packages/*'
  - '!packages/sbom'
  - 'tools/*'

linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false
packageManagerStrict: false
engineStrict: true

# Supply-chain guard: ignore npm versions published less than 24 hours ago.
# Need a fresher version? Add a targeted minimumReleaseAgeExclude entry with the exact version.
minimumReleaseAge: 1440 # ⚠️ Do NOT modify this.

minimumReleaseAgeExclude:
  - "devextreme-internal-tools@22.1.0"
  - "@devexpress/design-tokens-internal@262.26.0"

